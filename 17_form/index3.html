<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style3.css">
</head>
<body>

    <h2>회원 가입</h2>
    <form action="#" name="필수정보" method="post">
        <fieldset>
            <legend>필수정보</legend>
            <ol>
                <li class="namebox">
                    <label for="name">이름</label>
                    <input type="name" name="name" id="name">
                </li>
            </ol>
        </fieldset>
    </form>

    <form action="#" name="선택정보" method="post">
        <fieldset>
            <legend>선택정보</legend>
            <ol>
                <li class="birthdaybox">
                    <label for="date">생일</label>
                    <input type="date" name="date" id="date">
                </li>
            </ol>
        </fieldset>
    </form>
</body>
</html>
