<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category - Soft Minimal Chic Shop</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <header class="page-header">
            <h1 class="page-title">Category</h1>
        </header>

        <div class="main-content">
            <section class="category-list-section">
                <div class="category-large-grid">
                    <a href="product-list.html?category=%EC%95%84%EC%9A%B0%ED%84%B0" class="category-large-card" data-category="아우터">
                        <div class="category-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1764179690282-62eb5052a5a7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="아우터" class="category-image">
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">아우터</h3>
                            <p class="category-count">2 items</p>
                        </div>
                    </a>

                    <a href="product-list.html?category=%EC%83%81%EC%9D%98" class="category-large-card" data-category="상의">
                        <div class="category-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1764271692129-767f58952c26?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="상의" class="category-image">
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">상의</h3>
                            <p class="category-count">3 items</p>
                        </div>
                    </a>

                    <a href="product-list.html?category=%ED%95%98%EC%9D%98" class="category-large-card" data-category="하의">
                        <div class="category-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1594734415578-00fc9540929b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="하의" class="category-image">
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">하의</h3>
                            <p class="category-count">2 items</p>
                        </div>
                    </a>

                    <a href="product-list.html?category=%EC%9B%90%ED%94%BC%EC%8A%A4" class="category-large-card" data-category="원피스">
                        <div class="category-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1568163059147-8d321a0c5f71?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="원피스" class="category-image">
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">원피스</h3>
                            <p class="category-count">1 item</p>
                        </div>
                    </a>

                    <a href="product-list.html?category=%EB%8B%88%ED%8A%B8" class="category-large-card" data-category="니트">
                        <div class="category-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1764974345389-09da4244809c?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="니트" class="category-image">
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">니트</h3>
                            <p class="category-count">2 items</p>
                        </div>
                    </a>

                    <a href="product-list.html?category=%EC%84%B8%ED%8A%B8" class="category-large-card" data-category="세트">
                        <div class="category-image-wrapper">
                            <img src="https://images.unsplash.com/photo-1632282004709-98206cfa8452?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="세트" class="category-image">
                        </div>
                        <div class="category-info">
                            <h3 class="category-name">세트</h3>
                            <p class="category-count">1 item</p>
                        </div>
                    </a>
                </div>
            </section>

            <section class="product-section">
                <h2 class="section-title">특별 기획전</h2>
                <div class="special-category-list">
                    <a href="product-list.html?category=%EC%8B%A0%EC%83%81%ED%92%88" class="special-category-item" data-category="신상품">
                        <div class="special-category-icon" style="background-color: var(--sub-color);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <path d="M12 2 2 7l10 5 10-5-10-5z"/>
                                <path d="m2 17 10 5 10-5"/>
                                <path d="m2 12 10 5 10-5"/>
                            </svg>
                        </div>
                        <div class="special-category-text">
                            <h4 class="special-category-name">신상품</h4>
                            <p class="special-category-desc">이번 주 새로운 아이템</p>
                        </div>
                        <svg class="special-category-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="product-list.html?category=%EC%95%84%EC%9A%B0%ED%84%B0" class="special-category-item" data-category="아우터">
                        <div class="special-category-icon" style="background-color: var(--sub-color);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <circle cx="9" cy="21" r="1"/>
                                <circle cx="20" cy="21" r="1"/>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                            </svg>
                        </div>
                        <div class="special-category-text">
                            <h4 class="special-category-name">베스트</h4>
                            <p class="special-category-desc">인기 상품 모음</p>
                        </div>
                        <svg class="special-category-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="product-list.html?category=%EC%84%B8%ED%8A%B8" class="special-category-item" data-category="세트">
                        <div class="special-category-icon" style="background-color: var(--sub-color);">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </div>
                        <div class="special-category-text">
                            <h4 class="special-category-name">셋업룩</h4>
                            <p class="special-category-desc">한 번에 완성되는 세련된 룩</p>
                        </div>
                        <svg class="special-category-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>
                </div>
            </section>
        </div>

        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-button" data-tab="home">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="tab-label">Home</span>
            </a>
            <a href="category.html" class="tab-button" data-tab="category">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="7" height="7" x="3" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="14" rx="1"/>
                    <rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
                <span class="tab-label">Category</span>
            </a>
            <a href="cart.html" class="tab-button" data-tab="cart">
                <div class="tab-icon-wrapper">
                    <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <span class="wishlist-badge" id="wishlist-badge" style="display: none;">0</span>
                </div>
                <span class="tab-label">Cart</span>
            </a>
            <a href="my.html" class="tab-button" data-tab="my">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="tab-label">My</span>
            </a>
        </nav>
    </div>

    <script src="./script/script.js"></script>
</body>
</html>
