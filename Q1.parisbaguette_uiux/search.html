<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARIS BAGUETTE Store Search</title>

  <link rel="stylesheet" href="./css/search.css" />

  
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <a href="./main.html" class="logo-area">
        <img src="./images/logobannerimg.png" alt="PARIS BAGUETTE" class="logo-img" />
      </a>

      <button type="button" class="menu-btn" aria-label="메뉴 열기">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay" aria-hidden="true"></div>

<!-- Mobile Menu Panel -->
<aside class="mobile-menu-panel" id="mobileMenuPanel" aria-label="모바일 메뉴" aria-hidden="true">
  <div class="mobile-menu-top">
    <strong class="mobile-menu-title">MENU</strong>

    <button class="mobile-menu-close" id="mobileMenuClose" type="button" aria-label="메뉴 닫기">
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="mobile-menu-nav" aria-label="모바일 전체 메뉴">
    <ul>
      <li><a href="./main.html">홈</a></li>
      <li><a href="#">회사소개</a></li>
      <li><a href="./order.html">메뉴</a></li>
      <li><a href="#">문의하기</a></li>
    </ul>
  </nav>
</aside>

    <!-- main -->
    <main>
      <!-- Search Page -->
      <section id="searchPage" class="page search-page active">
        <section class="search-area">
          <form id="searchForm" class="search-form">
            <input
              type="text"
              id="searchInput"
              placeholder="지역또는 키워드를 입력해주세요."
              autocomplete="off"
            />
            <button type="button" id="mapOpenBtn" class="map-open-btn" aria-label="지도 보기">
              <img src="./images/map-icon.svg" alt="지도 보기" class="map-icon-img" />
            </button>
          </form>
        </section>
      
        <section class="keyword-section">
          <h2>최근 검색어</h2>
          <div id="recentKeywords" class="keyword-list"></div>
        </section>
      
        <section class="keyword-section">
          <h2>인기 키워드</h2>
          <div class="keyword-list">
            <button type="button" class="keyword-btn popular" data-keyword="딜리버리">딜리버리</button>
            <button type="button" class="keyword-btn popular" data-keyword="주차가능">주차가능</button>
          </div>
        </section>
      </section>
      
      <!-- Result Page -->
      <section id="resultPage" class="page result-page">
        <div class="sub-header">
          <button type="button" class="back-btn" data-target="searchPage" aria-label="뒤로가기"></button>
          <h1>검색결과</h1>
        </div>
      
        <section id="resultList" class="result-list"></section>
      </section>
      
      <!-- Map Page -->
      <section id="mapPage" class="page map-page">
        <div class="sub-header">
          <button type="button" class="back-btn" data-target="searchPage" aria-label="뒤로가기"></button>
          <h1>전국 맵 지도</h1>
        </div>
      
        <section class="map-box">
          <div id="kakaoMap" class="kakao-map"></div>
        </section>
      
        <section id="mapStoreList" class="map-store-list"></section>
      </section>
      
      <!-- Detail Page -->
      <section id="detailPage" class="page detail-page">
        <div class="detail-header">
          <button type="button" class="back-btn detail-back" data-target="resultPage" aria-label="뒤로가기"></button>
        </div>
      
        <section class="store-visual">
          <div class="store-title-row">
            <span class="store-logo-symbol"></span>
            <div>
              <h1 id="detailStoreName">김포청송마을점</h1>
              <p id="detailStoreAddress">경기도 김포시 장기동 1324</p>
            </div>
          </div>
      
          <div class="store-main-img">
            <img id="detailStoreImage" src="./images/store-main.jpg" alt="매장 이미지" />
          </div>
        </section>
      
        <section class="order-type">
          <button type="button" class="order-tab active" data-order="delivery">DELIVERY</button>
          <button type="button" class="order-tab" data-order="pickup">PICK UP</button>
        </section>
      
        <section id="deliveryInfo" class="order-info active">
          <div class="info-row">
            <span>배달비</span>
            <strong>0원</strong>
          </div>
          <div class="info-row">
            <span>최소주문금액</span>
            <strong>15,000원</strong>
          </div>
        </section>
      
        <section id="pickupInfo" class="order-info">
          <div class="pickup-title-row">
            <strong>도착예정 시간</strong>
            <button type="button">예약설정</button>
          </div>
          <p>주문 접수 순서대로 제품 준비됩니다. 점포 방문 후 대기번호를 확인해주세요.</p>
        </section>
      
        <button type="button" class="order-submit-btn">주문하러가기</button>
      
        <section class="menu-tab-wrap">
          <ul id="menuTabs" class="menu-tabs">
            <li><button type="button" class="menu-tab active" data-category="all">전체</button></li>
            <li><button type="button" class="menu-tab" data-category="recommend">추천메뉴</button></li>
            <li><button type="button" class="menu-tab" data-category="bread">브레드</button></li>
            <li><button type="button" class="menu-tab" data-category="cake">케이크</button></li>
            <li><button type="button" class="menu-tab" data-category="sandwich">샌드위치/샐러드</button></li>
            <li><button type="button" class="menu-tab" data-category="dessert">디저트/스낵</button></li>
            <li><button type="button" class="menu-tab" data-category="coffee">커피/음료</button></li>
          </ul>
        </section>
      
        <section id="productList" class="product-list"></section>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="하단 메뉴">
      <a href="./main.html" class="nav-item">
        <img src="./images/home-symbol.svg" alt="홈" />
        <span>홈</span>
      </a>
      <a href="./search.html" class="nav-item active">
        <img src="./images/search-symbol.svg" alt="검색" />
        <span>검색</span>
      </a>
      <a href="./order.html" class="nav-item nav-item--order">
        <img src="./images/bread-loaf-bold.svg" alt="주문" />
        <span>주문</span>
      </a>
      <a href="#" class="nav-item">
        <img src="./images/coupon-line.svg" alt="혜택" />
        <span>혜택</span>
      </a>
      <a href="#" class="nav-item">
        <img src="./images/meteor-icons_user.svg" alt="마이" />
        <span>MY</span>
      </a>
    </nav>

  </div>

  <script src="./script/search.js"></script>
</body>
</html>
