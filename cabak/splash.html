<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHABAK Splash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8f6;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .splash-link {
      display: block;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      min-height: 812px;
      text-decoration: none;
      color: inherit;
    }

    .mobile-frame {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      min-height: 812px;
      background: #f7f8f6;
      overflow: hidden;
    }

    .splash-inner {
      position: absolute;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img-box {
      width: 214px;
      margin-bottom: 10px;
    }

    .logo-img-box img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .loading-wrap {
      position: absolute;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%);
      width: 210px;
      height: 6px;
      background: rgba(83, 109, 167, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .loading-bar {
      width: 0;
      height: 100%;
      background: #536da7;
      border-radius: 999px;
      animation: loading 3s linear forwards;
    }

    @keyframes loading {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }

    @media (max-width: 360px) {
      .mobile-frame {
        min-height: 720px;
      }

      .splash-inner {
        top: 46%;
      }

      .brand-name {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <a href="./swiperslide.html" class="splash-link" aria-label="swiperslide 페이지로 이동">
    <main class="mobile-frame">
      <section class="splash-inner" aria-label="CHABAK splash loading screen">
        <div class="logo-img-box">
          <img src="./images/Gemini_Generated_Image_3srmew3srmew3srm2 1.png" alt="CHABAK 로고" />
        </div>
      </section>

      <div class="loading-wrap" aria-label="3초 로딩 진행바">
        <div class="loading-bar"></div>
      </div>
    </main>
  </a>

  <script>
    const splashLink = document.querySelector(".splash-link");

    window.addEventListener("load", function () {
      setTimeout(function () {
        window.location.href = splashLink.href;
      }, 3000);
    });
  </script>
</body>
</html>
