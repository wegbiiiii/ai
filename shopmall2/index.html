<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Minimal Chic Shop</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <header class="top-tab-bar">
            <a href="index.html" class="top-brand" aria-label="ChoiGun 홈으로 이동">
                <span class="brand-mark">C</span>
                <div class="brand-text-wrap">
                    <span class="brand-name">ChoiGun</span>
                    <span class="brand-subtitle">soft beauty select shop</span>
                </div>
            </a>

            <div class="top-tab-actions">
                <button class="top-action-button" type="button" aria-label="검색">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-3.5-3.5"></path>
                    </svg>
                </button>

                <button class="top-action-button" type="button" aria-label="장바구니">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="20" r="1"></circle>
                        <circle cx="18" cy="20" r="1"></circle>
                        <path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h9.9a1 1 0 0 0 1-.8L21 7H7"></path>
                    </svg>
                </button>

                <button class="top-action-button notification-button" type="button" aria-label="알림">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>
                        <path d="M10 17a2 2 0 0 0 4 0"></path>
                    </svg>
                    <span class="notification-dot"></span>
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="hero-banner">
                <img src="https://images.unsplash.com/photo-1580711508348-59deea718055?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="Hero Banner">
                <div class="hero-content">
                    <h1 class="hero-title">Spring Collection</h1>
                    <p class="hero-subtitle">따뜻한 봄을 위한 소프트 에센셜</p>
                </div>
            </div>

            <div class="category-section">
                <div class="category-chips">
                    <button class="category-chip active" data-category="신상품">신상품</button>
                    <button class="category-chip" data-category="아우터">아우터</button>
                    <button class="category-chip" data-category="상의">상의</button>
                    <button class="category-chip" data-category="하의">하의</button>
                    <button class="category-chip" data-category="원피스">원피스</button>
                    <button class="category-chip" data-category="니트">니트</button>
                    <button class="category-chip" data-category="세트">세트</button>
                </div>
            </div>

            <section class="product-section">
                <h2 class="section-title">오늘의 무드</h2>
                <div class="product-grid" id="mood-products"></div>
            </section>

            <section class="product-section">
                <h2 class="section-title">베스트 상품</h2>
                <div class="product-grid" id="best-products"></div>
            </section>

            <section class="product-section">
                <h2 class="section-title">소프트 데일리 에딧</h2>
                <div class="product-grid" id="daily-products"></div>
            </section>
        </div>

        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-button" data-tab="home">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="tab-label">Home</span>
            </a>
            <a href="category.html" class="tab-button" data-tab="category">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect width="7" height="7" x="3" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="14" rx="1"/>
                    <rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
                <span class="tab-label">Category</span>
            </a>
            <a href="cart.html" class="tab-button" data-tab="cart">
                <div class="tab-icon-wrapper">
                    <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <span class="wishlist-badge" id="wishlist-badge" style="display: none;">0</span>
                </div>
                <span class="tab-label">Cart</span>
            </a>
            <a href="my.html" class="tab-button" data-tab="my">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="tab-label">My</span>
            </a>
        </nav>
    </div>

    <script src="./script/script.js"></script>
</body>
</html>
