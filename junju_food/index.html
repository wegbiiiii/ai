<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전주 맛집 서비스</title>
    <!-- Lucide Icons for UI elements -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Kakao Map API - 사용자 API 키를 여기에 넣으세요 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ba55f074c6737f19be5b6e2e4944c6ec&libraries=services"></script>
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-bg: #f8f9fa;
            --text-main: #333333;
            --text-sub: #666666;
            --border-color: #eeeeee;
            --accent-dark: #333333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--secondary-bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* 메인 레이아웃 컨테이너 */
        #app {
            max-width: 480px;
            margin: 0 auto;
            background: var(--primary-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 헤더 영역 */
        .header {
            padding: 20px 20px 10px 20px;
            background: #fff;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
        }

        .header-title p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: #999;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        /* 검색창 */
        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1.5px solid var(--border-color);
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #333;
        }

        /* 가로 스크롤 탭 바 */
        .tab-bar {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 10px;
            padding: 5px 0 15px 0;
            scrollbar-width: none; /* Firefox */
        }

        .tab-bar::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        .tab-item {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            background: #fff;
            cursor: pointer;
        }

        .tab-item.active {
            background: var(--accent-dark);
            color: #fff;
            border-color: var(--accent-dark);
        }

        /* 리스트 영역 */
        .content-scroll {
            flex: 1;
            padding: 10px 20px;
            padding-bottom: 80px;
        }

        .food-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 15px;
            position: relative;
            cursor: pointer;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin: 0;
        }

        .parking-tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #444;
            color: #fff;
        }

        .card-info p {
            margin: 6px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .info-label {
            font-weight: 800;
            margin-right: 5px;
        }

        .card-actions {
            position: absolute;
            right: 18px;
            bottom: 18px;
            display: flex;
            gap: 12px;
        }

        /* 하단 고정 메뉴 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #fff;
            border-top: 1px solid var(--border-color);
            display: flex;
            padding: 10px 20px;
            gap: 10px;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            background: #fff;
            cursor: pointer;
        }

        .nav-btn.active {
            background: #333;
            color: #fff;
        }

        /* 상세 페이지 레이어 */
        #detail-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 200;
            display: none;
            overflow-y: auto;
            max-width: 480px;
            left: 50%;
            transform: translateX(-50%);
        }

        .detail-img {
            width: 100%;
            height: 250px;
            background-color: #eee;
            object-fit: cover;
        }

        .detail-content {
            padding: 20px;
        }

        .detail-label {
            display: inline-block;
            background: #444;
            color: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.8);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #map {
            width: 100%;
            height: 200px;
            margin-top: 10px;
            border-radius: 10px;
            background: #eee;
        }

        /* 로딩 인디케이터 */
        #loader {
            display: none;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 메인 목록 페이지 -->
    <div id="main-page">
        <header class="header">
            <div class="header-top">
                <div class="header-title">
                    <h1>전주 맛집 서비스</h1>
                    <p id="total-count">전체 0건</p>
                </div>
                <div class="header-actions">
                    <i data-lucide="rotate-ccw" size="20" style="cursor:pointer" onclick="fetchData()"></i>
                    <i data-lucide="heart" size="20" style="cursor:pointer"></i>
                </div>
            </div>

            <div class="search-container">
                <i data-lucide="search" class="search-icon" size="20"></i>
                <input type="text" class="search-input" placeholder="가게명/주소/메뉴로 검색" onkeyup="handleSearch(event)">
            </div>

            <div class="tab-bar">
                <div class="tab-item active" onclick="filterCategory(this, '전체')">전체</div>
                <div class="tab-item" onclick="filterCategory(this, '백반집')">백반집</div>
                <div class="tab-item" onclick="filterCategory(this, '전주비빔밥')">전주비빔밥</div>
                <div class="tab-item" onclick="filterCategory(this, '콩나물국밥')">콩나물국밥</div>
                <div class="tab-item" onclick="filterCategory(this, '한정식')">한정식</div>
                <div class="tab-item" onclick="filterCategory(this, '국수')">국수</div>
                <div class="tab-item" onclick="filterCategory(this, '막걸리')">막걸리</div>
            </div>
        </header>

        <div id="loader">데이터를 불러오는 중...</div>

        <main class="content-scroll" id="list-container">
            <!-- 데이터가 동적으로 삽입됨 -->
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active">맛집</button>
            <button class="nav-btn">즐겨찾기</button>
        </nav>
    </div>

    <!-- 상세 페이지 레이어 -->
    <div id="detail-page">
        <button class="back-btn" onclick="closeDetail()">
            <i data-lucide="chevron-left"></i>
        </button>
        <img src="https://images.unsplash.com/photo-1553163147-622ab578d844?auto=format&fit=crop&q=80&w=800" alt="음식 이미지" class="detail-img">
        <div class="detail-content">
            <span class="detail-label">상호명</span>
            <div id="det-name" class="detail-value" style="font-weight: 700; font-size: 20px;"></div>
            
            <span class="detail-label">주소</span>
            <div id="det-addr" class="detail-value"></div>
            
            <span class="detail-label">소개</span>
            <div id="det-intro" class="detail-value">전통의 맛을 지켜온 전주의 대표 맛집입니다. 신선한 재료와 깊은 맛을 느껴보세요.</div>
            
            <span class="detail-label">메뉴명</span>
            <div id="det-menu" class="detail-value"></div>
            
            <span class="detail-label">대표전화</span>
            <div id="det-tel" class="detail-value"></div>
            
            <span class="detail-label">운영시간</span>
            <div id="det-time" class="detail-value">10:00 ~ 21:00</div>

            <div id="map"></div>
        </div>
    </div>
</div>

<script>
    // --- 설정 변수 ---
    const API_URL = "https://openapi.jeonju.go.kr/rest/jeonjufood/getJeonjuFoodList";
    const API_KEY = "de187fd45d650881be9a659b12d26ea56f75c3bb95e5dedc89b25cd5a1ae692b"; // 여기에 API 키를 입력하세요 (필요시)
    
    let allData = []; // 원본 데이터 저장
    let map = null;
    let marker = null;

    // --- 초기화 ---
    window.onload = function() {
        lucide.createIcons();
        fetchData();
        initKakaoMap();
    };

    function initKakaoMap() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(35.8242238, 127.1479532),
            level: 3
        };
        map = new kakao.maps.Map(container, options);
    }

    // --- 데이터 통신 (Mocking & API 구조) ---
    async function fetchData() {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';

        // 실제 환경에서는 API_URL에 키를 포함하여 fetch 합니다.
        // 여기서는 시안과 동일한 더미 데이터를 구성하여 완벽한 UI를 보여줍니다.
        try {
            // 실제 호출 예시 코드:
            /*
            const response = await fetch(`${API_URL}?authApiKey=${API_KEY}`);
            const data = await response.json();
            allData = data.body.data || [];
            */
            
            // 시안과 동일한 데이터 (Mock)
            allData = Array.from({ length: 15 }, (_, i) => ({
                id: i,
                storeNm: "80년 전통 할머니 국밥",
                address: "부산 부산진구 서면로 68번길 33", // 시안 텍스트 유지
                menu: "따로 국밥 ₩7,000 수육 ₩10,000",
                tel: "051-666-5555",
                parking: i % 2 === 0 ? "주차가능" : "주차불가",
                category: i % 3 === 0 ? "백반집" : (i % 3 === 1 ? "콩나물국밥" : "한정식")
            }));

            renderList(allData);
            document.getElementById('total-count').innerText = `전체 ${allData.length}건`;
        } catch (error) {
            console.error("데이터 로드 실패", error);
        } finally {
            loader.style.display = 'none';
        }
    }

    // --- 렌더링 함수 ---
    function renderList(data) {
        const container = document.getElementById('list-container');
        container.innerHTML = '';

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'food-card';
            card.onclick = () => openDetail(item);
            
            card.innerHTML = `
                <div class="card-header">
                    <h3 class="card-title">${item.storeNm}</h3>
                    <span class="parking-tag">${item.parking}</span>
                </div>
                <div class="card-info">
                    <p><span class="info-label">주소:</span> ${item.address}</p>
                    <p><span class="info-label">메뉴:</span> ${item.menu}</p>
                </div>
                <div class="card-actions">
                    <i data-lucide="search" size="20"></i>
                    <i data-lucide="heart" size="20"></i>
                </div>
            `;
            container.appendChild(card);
        });
        lucide.createIcons();
    }

    // --- 필터링 및 검색 ---
    function handleSearch(e) {
        const query = e.target.value.toLowerCase();
        const filtered = allData.filter(item => 
            item.storeNm.toLowerCase().includes(query) || 
            item.address.toLowerCase().includes(query) ||
            item.menu.toLowerCase().includes(query)
        );
        renderList(filtered);
    }

    function filterCategory(el, category) {
        // UI 업데이트
        document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
        el.classList.add('active');

        // 필터링
        if (category === '전체') {
            renderList(allData);
        } else {
            const filtered = allData.filter(item => item.category === category);
            renderList(filtered);
        }
    }

    // --- 상세 페이지 제어 ---
    function openDetail(item) {
        document.getElementById('det-name').innerText = item.storeNm;
        document.getElementById('det-addr').innerText = item.address;
        document.getElementById('det-menu').innerText = item.menu;
        document.getElementById('det-tel').innerText = item.tel;
        
        const detailPage = document.getElementById('detail-page');
        detailPage.style.display = 'block';

        // 지도 주소 검색 및 이동
        const geocoder = new kakao.maps.services.Geocoder();
        geocoder.addressSearch(item.address, function(result, status) {
            if (status === kakao.maps.services.Status.OK) {
                const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                
                // 마커 초기화 또는 생성
                if (marker) marker.setMap(null);
                marker = new kakao.maps.Marker({
                    map: map,
                    position: coords
                });

                map.setCenter(coords);
                // 모달 내부에서 지도 크기 재계산
                setTimeout(() => map.relayout(), 100);
            }
        });
    }

    function closeDetail() {
        document.getElementById('detail-page').style.display = 'none';
    }
</script>

</body>
</html>
