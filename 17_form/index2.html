<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style2.css">
</head>
<body>
    <form action="#" name="개인 정보" method="post">
        <fieldset>
            <legend>개인 정보</legend>
            <ol>
                <li class="namebox">
                    <label for="namebox">이름</label>
                    <input type="text" name="name" id="namebox">
                </li>

                <li class="mailbox">
                    <label for="mailbox">메일주소</label>
                    <input type="text" name="mail" id="mailbox"> 
                </li>
            </ol>
        </fieldset>
    </form>

    <form action="#" name="로그인정보" method="post">
        <fieldset>
            <legend>로그인 정보</legend>
            <ol>
                <li class="idbox">
                    <label for="id">아이디</label>
                    <input type="text" name="id" id="id">
                </li>

                <li class="pwbox">
                    <label for="pw">비밀번호</label>
                    <input type="password" name="password" id="pw">
                </li>
            </ol>

        </fieldset>

    </form>
</body>
</html>
