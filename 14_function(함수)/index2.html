<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수 선언 및 실행2</title>
</head>
<body>
    <script>
        //함수 사용 x
        document.write("홍길동님 안녕하세요<br>");
        document.write("김철수님 안녕하세요<br>");
        document.write("오영희님 안녕하세요<br>");
        document.write("조진갑님 안녕하세요<br>");
        document.write("<hr>");
        //함수 선언 사용 (매개변수 사용)
        function hi(name){
            document.write(`${name}님 환영합니다<br>`);
            
        }

        hi("홍길동");
        hi("김철수");
        hi("오영희");
        hi("조진갑");
    </script>
</body>
</html>
