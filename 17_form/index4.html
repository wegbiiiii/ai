<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style4.css">
</head>
<body>
    <form action="#" name="신청과목" method="post">
        <fieldset>
            <legend>신청과목</legend>
            <ol>
                <li class="grammer">
                    <p>이 달에 신청할 과목을 선택하세요 (1과목만 가능)</p>
                    <input type="radio" name="check" value="회화" id="select1" checked>
                    <label for="select1">회화</label>
                    <input type="radio" name="check" value="문법" id="select2">
                    <label for="select2">문법</label>
                    <input type="radio" name="check" value="작문" id="select3">
                    <label for="select3">작문</label>
                </li>
            </ol>
        </fieldset>
    </form>

    <form action="#" name="메일링" method="post">
        <fieldset>
            <legend>메일링</legend>
            <ol>
                <li class="mailnews">
                    <p>메일로 받고 싶은 뉴스 주제를 선택해 주세요(복수선택가능)</p>
                    <input type="checkbox" name="newscheck1" value="해외단신" id="nscheck1" checked>
                    <label for="nscheck1">해외단신</label>
                    <input type="checkbox" name="newscheck2" value="5문 회화" id="nscheck2" checked>
                    <label for="nscheck2">5분 회화</label>
                    <input type="checkbox" name="newscheck3" value="모닝팝스" id="nscheck3" checked>
                    <label for="nscheck3">모닝팝스</label>

                </li>
            </ol>
        </fieldset>
    </form>
</body>
</html>
