<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색엔진(이미지)</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px; /* 상단 여백 */
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* 제목 스타일 */
        h1 {
            font-size: 26px;
            color: #000;
            margin-bottom: 15px; /* 제목 아래 여백 */
        }

        /* 공통 가로 구분선 스타일 */
        .divider {
            border: none;
            border-top: 1px solid #a52a2a;
            width: 200px;
            margin: 0 auto; /* 중앙 정렬 */
        }

        /* 3번째 구분선 전용 스타일 (400px) */
        .divider.wide {
            width: 400px;
        }

        /* 로고 리스트 스타일 */
        .logo-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 35px;    /* 구분선과 첫 로고 사이 여백 */
            margin-bottom: 35px; /* 마지막 로고와 아래 구분선 사이 여백 */
            gap: 25px;           /* 로고 사이 간격 */
        }

        .logo-list a {
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .logo-list a:hover {
            transform: scale(1.05);
        }

        /* 로고 이미지 크기 조정 */
        .logo-img {
            display: block;
            height: auto;
        }

        .logo-naver { width: 160px; }
        .logo-daum { width: 150px; }
        .logo-google { width: 140px; }

        /* 하단 링크 스타일 */
        .text-link {
            margin-top: 25px;    /* 구분선과 링크 사이 여백 */
            margin-bottom: 25px; /* 링크와 아래 구분선 사이 여백 */
        }

        .text-link a {
            color: #0000ff;
            text-decoration: none; /* 기본 밑줄 제거 */
            font-size: 15px;
            transition: color 0.2s, text-decoration 0.2s;
        }

        /* 하단 링크 hover 효과 추가 */
        .text-link a:hover {
            color: #ff0000; /* 마우스 올렸을 때 색상 변경 (예: 빨간색) */
            text-decoration: underline; /* 마우스 올렸을 때 밑줄 생성 */
        }

        /* 푸터 스타일 */
        footer {
            margin-top: 15px;    /* 마지막 구분선과 푸터 사이 여백 */
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        /* 반응형 대응 */
        @media (max-width: 480px) {
            .logo-naver { width: 130px; }
            .logo-daum { width: 120px; }
            .logo-google { width: 110px; }
            .divider.wide { width: 90%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 제목 -->
        <h1>검색엔진(이미지)</h1>
        
        <!-- 1번째 구분선 (200px, 1px 두께) -->
        <hr class="divider">

        <!-- 검색엔진 로고 리스트 -->
        <div class="logo-list">
            <a href="https://www.naver.com" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Naver_Logotype.svg" alt="Naver" class="logo-img logo-naver">
            </a>
            <a href="https://www.daum.net" target="_blank">
                <img src="https://t1.daumcdn.net/daumtop_chanel/op/20200723055344399.png" alt="Daum" class="logo-img logo-daum">
            </a>
            <a href="https://www.google.com" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="logo-img logo-google">
            </a>
        </div>

        <!-- 2번째 구분선 (200px, 1px 두께) -->
        <hr class="divider">

        <!-- 하단 텍스트 링크 -->
        <div class="text-link">
            <a href="./ai_search.html">[검색엔진(문자)로 가기]</a>
        </div>

        <!-- 3번째 구분선 (400px, 1px 두께) -->
        <hr class="divider wide">

        <!-- 카피라이트 -->
        <footer>
            CopyWrite © 이호연 닷컴 All Right
        </footer>
    </div>

</body>
</html>
