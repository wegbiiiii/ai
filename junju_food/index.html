<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전주 맛집 서비스</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f3f3f3;
      color: #1f1f1f;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 402px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      position: relative;
      overflow: hidden;
      padding-bottom: 76px;
    }

    .page {
      display: none;
      min-height: 100vh;
      background: #fff;
    }

    .page.active {
      display: block;
    }

    .main-header {
      padding: 28px 16px 10px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .main-title {
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .total-count {
      margin-top: 3px;
      display: block;
      color: #9a9a9a;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 2px;
    }

    .icon-btn {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #050505;
    }

    .icon-btn svg {
      width: 100%;
      height: 100%;
      stroke-width: 2.2;
    }

    .search-box {
      margin-top: 15px;
      width: 100%;
      height: 56px;
      border: 1.5px solid #343434;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 0 17px;
      gap: 12px;
      background: #fff;
    }

    .search-box svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .search-box input {
      border: 0;
      outline: none;
      width: 100%;
      height: 100%;
      font-size: 18px;
      font-weight: 700;
      color: #222;
    }

    .search-box input::placeholder {
      color: #d1d1d1;
    }

    .category-wrap {
      margin-top: 16px;
      width: calc(100% + 16px);
      overflow-x: auto;
      padding-bottom: 2px;
      -ms-overflow-style: none;
      scrollbar-width: none;
      display: flex;
      gap: 8px;
    }

    .category-wrap::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      flex: 0 0 auto;
      height: 30px;
      padding: 0 13px;
      border: 1.5px solid #2c2c2c;
      border-radius: 16px;
      background: #fff;
      color: #242424;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .category-btn.active {
      background: #333;
      color: #fff;
    }

    .food-list {
      padding: 0 16px 18px;
    }

    .food-card {
      width: 100%;
      min-height: 134px;
      border: 1.5px solid #5a5a5a;
      border-radius: 5px;
      padding: 21px 14px 14px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr 86px;
      gap: 10px;
      background: #fff;
    }

    .food-info {
      min-width: 0;
    }

    .food-name {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: -0.8px;
      margin-bottom: 15px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .food-text {
      font-size: 16px;
      line-height: 1.55;
      color: #444;
      letter-spacing: -0.45px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .food-text strong {
      color: #252525;
      font-weight: 900;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 16px;
    }

    .parking-badge {
      height: 31px;
      padding: 0 14px;
      border-radius: 16px;
      background: #333;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .small-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-right: 2px;
    }

    .small-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #050505;
    }

    .small-btn svg {
      width: 31px;
      height: 31px;
      stroke-width: 2.1;
    }

    .pagination {
      padding: 6px 16px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 34px;
      height: 34px;
      border: 1px solid #ddd;
      border-radius: 17px;
      font-size: 14px;
      font-weight: 800;
      color: #333;
      background: #fff;
    }

    .page-btn.active {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    .page-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .empty-state {
      padding: 80px 20px;
      text-align: center;
      color: #777;
      font-size: 15px;
      line-height: 1.6;
    }

    .error-state {
      margin: 18px 16px;
      padding: 30px 18px;
      border: 1.5px solid #333;
      border-radius: 8px;
      background: #fff;
      text-align: center;
      color: #222;
    }

    .error-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .error-text {
      font-size: 15px;
      line-height: 1.6;
      color: #666;
      word-break: keep-all;
      margin-bottom: 18px;
    }

    .error-retry-btn {
      height: 38px;
      padding: 0 22px;
      border-radius: 19px;
      background: #333;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 402px;
      height: 61px;
      background: #fff;
      border-top: 1px solid #242424;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 31px;
      padding: 0 16px;
    }

    .nav-btn {
      flex: 1;
      height: 40px;
      border: 1.5px solid #1e1e1e;
      border-radius: 19px;
      background: #fff;
      color: #303030;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.35px;
    }

    .nav-btn.active {
      background: #333;
      color: #fff;
    }

    .detail-page {
      padding-bottom: 88px;
    }

    .detail-hero {
      width: calc(100% - 32px);
      height: 226px;
      margin: 16px auto 26px;
      border-radius: 0 0 15px 15px;
      overflow: hidden;
      background: #eee;
      position: relative;
    }

    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .back-btn {
      position: absolute;
      top: 13px;
      left: 13px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 5px 18px rgba(0,0,0,0.13);
    }

    .back-btn svg {
      width: 23px;
      height: 23px;
    }

    .detail-content {
      padding: 0 16px;
    }

    .detail-section {
      margin-bottom: 18px;
    }

    .pill-title {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 14px;
      border-radius: 15px;
      background: #333;
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.35px;
      margin-bottom: 9px;
    }

    .detail-text {
      color: #4d4d4d;
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: -0.4px;
      word-break: keep-all;
    }

    .detail-text.description {
      text-align: justify;
    }

    .map-box {
      width: 100%;
      height: 218px;
      margin-top: 8px;
      background: #e9f0ec;
      overflow: hidden;
    }

    .map-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .route-btn {
      flex: 1;
      height: 38px;
      border-radius: 19px;
      background: #333;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .route-btn.sub {
      background: #fff;
      color: #222;
      border: 1.4px solid #333;
    }

    .favorite-only {
      padding: 18px 16px;
    }

    @media (max-width: 360px) {
      .food-card {
        grid-template-columns: 1fr 76px;
      }

      .food-name {
        font-size: 20px;
      }

      .food-text {
        font-size: 15px;
      }

      .small-actions {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="mainPage" class="page active">
      <header class="main-header">
        <div class="title-row">
          <div>
            <h1 class="main-title">전주 맛집 서비스</h1>
            <span class="total-count">전체 <b id="totalCount">0</b>건</span>
          </div>

          <div class="header-actions">
            <button class="icon-btn" type="button" id="refreshBtn" aria-label="새로고침">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <path d="M21 3v7h-7" />
              </svg>
            </button>
            <button class="icon-btn" type="button" id="topFavoriteBtn" aria-label="즐겨찾기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" />
              </svg>
            </button>
          </div>
        </div>

        <form class="search-box" id="searchForm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="7" stroke-width="2.4" />
            <path d="m16.5 16.5 4 4" stroke-width="2.4" stroke-linecap="round" />
          </svg>
          <input id="searchInput" type="search" placeholder="가게명/주소/메뉴로 검색" autocomplete="off" />
        </form>

        <div class="category-wrap" id="categoryWrap"></div>
      </header>

      <main>
        <div class="food-list" id="foodList"></div>
        <div class="pagination" id="pagination"></div>
      </main>
    </section>

    <section id="detailPage" class="page detail-page">
      <div class="detail-hero">
        <button class="back-btn" type="button" id="backBtn" aria-label="뒤로가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="m15 18-6-6 6-6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <img id="detailImage" alt="맛집 대표 이미지" />
      </div>

      <div class="detail-content">
        <section class="detail-section">
          <h2 class="pill-title">상호명</h2>
          <p class="detail-text" id="detailName"></p>
        </section>

        <section class="detail-section">
          <h2 class="pill-title">주소</h2>
          <p class="detail-text" id="detailAddress"></p>
        </section>

        <section class="detail-section">
          <h2 class="pill-title">소개</h2>
          <p class="detail-text description" id="detailDescription"></p>
        </section>

        <section class="detail-section">
          <h2 class="pill-title">메뉴명</h2>
          <p class="detail-text" id="detailMenu"></p>
        </section>

        <section class="detail-section">
          <h2 class="pill-title">대표전화</h2>
          <p class="detail-text" id="detailTel"></p>
        </section>

        <section class="detail-section">
          <h2 class="pill-title">운영시간</h2>
          <p class="detail-text" id="detailTime"></p>
        </section>

        <section class="detail-section">
          <div id="map" class="map-box"></div>
          <div class="map-actions">
            <button class="route-btn" type="button" id="routeBtn">카카오맵 길찾기</button>
            <button class="route-btn sub" type="button" id="favoriteDetailBtn">즐겨찾기</button>
          </div>
        </section>
      </div>
    </section>

    <section id="favoritePage" class="page">
      <header class="main-header">
        <div class="title-row">
          <div>
            <h1 class="main-title">즐겨찾기</h1>
            <span class="total-count">저장 <b id="favoriteCount">0</b>건</span>
          </div>
        </div>
      </header>
      <main class="favorite-only">
        <div class="food-list" id="favoriteList"></div>
      </main>
    </section>

    <nav class="bottom-nav">
      <button class="nav-btn active" type="button" data-page="mainPage">맛집</button>
      <button class="nav-btn" type="button" data-page="favoritePage">즐겨찾기</button>
    </nav>
  </div>

  <script>
    const API_KEY = "de187fd45d650881be9a659b12d26ea56f75c3bb95e5dedc89b25cd5a1ae692b";
    const KAKAO_API_KEY = "ba55f074c6737f19be5b6e2e4944c6ec";
    const API_BASE_URL = "https://openapi.jeonju.go.kr/rest/jeonjufood";

    const categories = ["백반", "비빔밥", "콩나물국밥", "한정식", "막걸리", "한옥마을"];
    const pageSize = 10;
    const pageButtonSize = 5;

    let foods = [];
    let filteredFoods = [];
    let currentCategory = "백반";
    let currentPage = 1;
    let selectedFood = null;
    let map = null;
    let marker = null;

    const fallbackImages = [
      "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1498654896293-37aacf113fd9?auto=format&fit=crop&w=900&q=80"
    ];

      {

      {

      },
      {

        menu: "백반 ₩9,000 제육정식 ₩11,000",

        time: "09:30 ~ 21:00",
        parking: true,
        description: "다양한 반찬과 따뜻한 국을 함께 제공하는 백반 전문점입니다. 부담 없는 가격으로 현지식 식사를 원하는 방문객에게 적합합니다.",
        image: fallbackImages[2],
        lat: 35.821788,
        lng: 127.147015
      },
      {
        id: "sample-4",
        name: "전주 한정식 소담",
        category: "한정식",
        address: "전북특별자치도 전주시 완산구 은행로 30",
        menu: "한정식 ₩25,000 갈비찜 ₩18,000",
        tel: "063-000-0004",
        time: "11:30 ~ 21:00",
        parking: true,
        description: "전주식 반찬과 메인 요리를 코스로 즐길 수 있는 한정식 매장입니다. 가족 모임과 여행 식사에 잘 어울립니다.",
        image: fallbackImages[1],
        lat: 35.813957,
        lng: 127.151259
      },
      {
        id: "sample-5",
        name: "전주 막걸리 골목집",
        category: "막걸리",
        address: "전북특별자치도 전주시 완산구 서신천변로 11",
        menu: "막걸리상 ₩35,000 해물파전 ₩15,000",
        tel: "063-000-0005",
        time: "16:00 ~ 24:00",
        parking: false,
        description: "전주 막걸리 문화와 푸짐한 안주 구성을 경험할 수 있는 매장입니다. 저녁 시간대 방문에 적합합니다.",
        image: fallbackImages[2],
        lat: 35.827299,
        lng: 127.122770
      },
      {
        id: "sample-6",
        name: "한옥마을 전통 밥상",
        category: "한옥마을",
        address: "전북특별자치도 전주시 완산구 태조로 15",
        menu: "전통밥상 ₩15,000 떡갈비 ₩18,000",
        tel: "063-000-0006",
        time: "10:00 ~ 21:00",
        parking: true,
        description: "한옥마을 산책 코스와 함께 이용하기 좋은 전통 밥상 매장입니다. 관광객 접근성이 좋고 메뉴 구성이 간결합니다.",
        image: fallbackImages[0],
        lat: 35.815003,
        lng: 127.153210
      }
    ];

    const $ = (selector) => document.querySelector(selector);

    const foodListEl = $("#foodList");
    const favoriteListEl = $("#favoriteList");
    const paginationEl = $("#pagination");
    const totalCountEl = $("#totalCount");
    const searchInputEl = $("#searchInput");

    function init() {
      loadKakaoMapScript();
      renderCategories();
      bindEvents();
      loadFoods();
    }

    function loadKakaoMapScript() {
      if (!KAKAO_API_KEY || KAKAO_API_KEY === "카카오_API_KEY를_여기에_입력하세요") {
        return;
      }

      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_API_KEY}&libraries=services`;
      script.async = true;
      document.head.appendChild(script);
    }

    function bindEvents() {
      $("#searchForm").addEventListener("submit", function (e) {
        e.preventDefault();
        currentPage = 1;
        applyFilters();
      });

      searchInputEl.addEventListener("input", function () {
        currentPage = 1;
        applyFilters();
      });

      $("#refreshBtn").addEventListener("click", loadFoods);
      $("#topFavoriteBtn").addEventListener("click", function () {
        openPage("favoritePage");
      });

      $("#backBtn").addEventListener("click", function () {
        openPage("mainPage");
      });

      $("#routeBtn").addEventListener("click", openKakaoRoute);
      $("#favoriteDetailBtn").addEventListener("click", function () {
        if (!selectedFood) return;
        toggleFavorite(selectedFood.id);
        updateFavoriteDetailButton();
        renderFavorites();
      });

      document.querySelectorAll(".nav-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          openPage(btn.dataset.page);
        });
      });
    }

    function renderCategories() {
      const categoryWrap = $("#categoryWrap");
      categoryWrap.innerHTML = categories.map(function (category) {
        return `<button class="category-btn ${category === currentCategory ? "active" : ""}" type="button" data-category="${category}">${category}</button>`;
      }).join("");

      categoryWrap.querySelectorAll(".category-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          currentCategory = btn.dataset.category;
          currentPage = 1;
          renderCategories();
          applyFilters();
        });
      });
    }

    async function loadFoods() {
      foodListEl.innerHTML = `<div class="empty-state">전주 맛집 데이터를 불러오는 중입니다.</div>`;
      paginationEl.innerHTML = "";
      totalCountEl.textContent = "0";

      try {
        const requestUrl = buildApiUrl();
        const response = await fetch(requestUrl);

        if (!response.ok) {
          throw new Error(`API 요청 실패 - 상태 코드 ${response.status}`);
        }

        const data = await response.json();
        const normalized = normalizeApiData(data);

        if (normalized.length === 0) {
          throw new Error("API 응답에 표시할 맛집 데이터가 없습니다.");
        }

        foods = normalized;
        applyFilters();
        renderFavorites();
      } catch (error) {
        console.error("전주 맛집 데이터를 불러오지 못했습니다.", error);
        foods = [];
        filteredFoods = [];
        totalCountEl.textContent = "0";
        paginationEl.innerHTML = "";
        foodListEl.innerHTML = createErrorState(error.message);
        renderFavorites();
      }
    }

    function createErrorState(message) {
      return `
        <div class="error-state">
          <h2 class="error-title">데이터를 불러오지 못했습니다</h2>
          <p class="error-text">
            API 키, 요청 주소, CORS 허용 여부를 확인해 주세요.<br />
            ${escapeHtml(message || "알 수 없는 오류가 발생했습니다.")}
          </p>
          <button class="error-retry-btn" type="button" onclick="loadFoods()">다시 불러오기</button>
        </div>
      `;
    }

    function buildApiUrl() {
      const url = new URL(API_BASE_URL);
      url.searchParams.set("serviceKey", API_KEY);
      url.searchParams.set("pageNo", "1");
      url.searchParams.set("numOfRows", "200");
      url.searchParams.set("type", "json");
      return url.toString();
    }

    function normalizeApiData(data) {
      const items = findArray(data);

      return items.map(function (item, index) {
        const name = pick(item, ["name", "title", "storeName", "foodNm", "BSSH_NM", "MAIN_TITLE", "업소명", "상호명"]);
        const address = pick(item, ["addr", "address", "roadAddr", "RDNMADR", "ADDR1", "소재지도로명주소", "주소"]);
        const menu = pick(item, ["menu", "mainMenu", "rprsntvMenu", "MNU", "ITEMCNTNTS", "대표메뉴", "메뉴"]);
        const tel = pick(item, ["tel", "phone", "telNo", "CNTCT_TEL", "전화번호"]);
        const time = pick(item, ["time", "openTime", "useTime", "BSNS_TIME", "영업시간"]);
        const description = pick(item, ["description", "content", "intro", "ITEMCNTNTS", "소개", "설명"]);
        const image = pick(item, ["image", "imageUrl", "imgUrl", "MAIN_IMG_NORMAL", "MAIN_IMG_THUMB", "이미지"]);
        const lat = Number(pick(item, ["lat", "latitude", "LAT", "위도"])) || null;
        const lng = Number(pick(item, ["lng", "lon", "longitude", "LNG", "경도"])) || null;
        const rawCategory = pick(item, ["category", "type", "menuCategory", "분류", "업태"]);
        const category = matchCategory(`${rawCategory} ${name} ${menu} ${address}`);

        return {
          id: pick(item, ["id", "UC_SEQ", "NO", "번호"]) || `api-${index}`,
          name: name || "상호명 정보 없음",
          category: category,
          address: address || "주소 정보 없음",
          menu: menu || "메뉴 정보 없음",
          tel: tel || "전화번호 정보 없음",
          time: time || "운영시간 정보 없음",
          parking: String(pick(item, ["parking", "parkingYn", "PKPLCE_AT", "주차"])).includes("Y") || String(description).includes("주차"),
          description: description || "상세 소개 정보가 제공되지 않았습니다.",
          image: image || fallbackImages[index % fallbackImages.length],
          lat: lat,
          lng: lng
        };
      });
    }

    function findArray(value) {
      if (Array.isArray(value)) return value;
      if (!value || typeof value !== "object") return [];

      const possibleKeys = ["items", "item", "data", "list", "body", "response", "JeonjuFood"];
      for (const key of possibleKeys) {
        if (Array.isArray(value[key])) return value[key];
        const nested = findArray(value[key]);
        if (nested.length) return nested;
      }

      for (const key in value) {
        const nested = findArray(value[key]);
        if (nested.length) return nested;
      }

      return [];
    }

    function pick(obj, keys) {
      for (const key of keys) {
        if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") {
          return String(obj[key]).trim();
        }
      }
      return "";
    }

    function matchCategory(text) {
      const target = text || "";
      const found = categories.find(function (category) {
        return target.includes(category);
      });
      return found || currentCategory || "백반";
    }

    function buildSampleList() {
      const list = [];
      for (let i = 0; i < 36; i++) {
        const base = sampleFoods[i % sampleFoods.length];
        list.push({
          ...base,
          id: `${base.id}-${i}`,
          name: i < sampleFoods.length ? base.name : `${base.name} ${i + 1}`
        });
      }
      return list;
    }

    function applyFilters() {
      const keyword = searchInputEl.value.trim().toLowerCase();

      filteredFoods = foods.filter(function (food) {
        const categoryMatched = food.category === currentCategory || `${food.name} ${food.menu} ${food.address}`.includes(currentCategory);
        const text = `${food.name} ${food.address} ${food.menu}`.toLowerCase();
        const keywordMatched = !keyword || text.includes(keyword);
        return categoryMatched && keywordMatched;
      });

      totalCountEl.textContent = filteredFoods.length;
      renderFoodList();
      renderPagination();
    }

    function renderFoodList() {
      const start = (currentPage - 1) * pageSize;
      const pageItems = filteredFoods.slice(start, start + pageSize);

      if (pageItems.length === 0) {
        foodListEl.innerHTML = `<div class="empty-state">검색 결과가 없습니다.<br />다른 키워드나 분류를 선택해 주세요.</div>`;
        return;
      }

      foodListEl.innerHTML = pageItems.map(createFoodCard).join("");
      bindFoodCardEvents(foodListEl);
    }

    function createFoodCard(food) {
      const favoriteActive = isFavorite(food.id);
      return `
        <article class="food-card" data-id="${food.id}">
          <div class="food-info">
            <h2 class="food-name">${escapeHtml(food.name)}</h2>
            <p class="food-text"><strong>주소 :</strong> ${escapeHtml(food.address)}</p>
            <p class="food-text"><strong>메뉴 :</strong> ${escapeHtml(food.menu)}</p>
          </div>
          <div class="card-actions">
            <span class="parking-badge">${food.parking ? "주차가능" : "주차불가"}</span>
            <div class="small-actions">
              <button class="small-btn detail-open" type="button" aria-label="상세보기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="11" cy="11" r="7" />
                  <path d="m16.5 16.5 4 4" stroke-linecap="round" />
                </svg>
              </button>
              <button class="small-btn favorite-toggle" type="button" aria-label="즐겨찾기">
                <svg viewBox="0 0 24 24" fill="${favoriteActive ? "currentColor" : "none"}" stroke="currentColor">
                  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" />
                </svg>
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function bindFoodCardEvents(scope) {
      scope.querySelectorAll(".food-card").forEach(function (card) {
        const id = card.dataset.id;
        const food = foods.find(function (item) { return item.id === id; });

        card.querySelector(".detail-open").addEventListener("click", function (e) {
          e.stopPropagation();
          openDetail(food);
        });

        card.querySelector(".favorite-toggle").addEventListener("click", function (e) {
          e.stopPropagation();
          toggleFavorite(id);
          renderFoodList();
          renderFavorites();
        });

        card.addEventListener("click", function () {
          openDetail(food);
        });
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredFoods.length / pageSize);

      if (totalPages <= 1) {
        paginationEl.innerHTML = "";
        return;
      }

      const currentGroup = Math.ceil(currentPage / pageButtonSize);
      const startPage = (currentGroup - 1) * pageButtonSize + 1;
      const endPage = Math.min(startPage + pageButtonSize - 1, totalPages);

      let html = `<button class="page-btn" type="button" data-page="prev" ${currentPage === 1 ? "disabled" : ""}>‹</button>`;

      for (let page = startPage; page <= endPage; page++) {
        html += `<button class="page-btn ${page === currentPage ? "active" : ""}" type="button" data-page="${page}">${page}</button>`;
      }

      html += `<button class="page-btn" type="button" data-page="next" ${currentPage === totalPages ? "disabled" : ""}>›</button>`;

      paginationEl.innerHTML = html;

      paginationEl.querySelectorAll(".page-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const pageValue = btn.dataset.page;

          if (pageValue === "prev") currentPage -= 1;
          else if (pageValue === "next") currentPage += 1;
          else currentPage = Number(pageValue);

          renderFoodList();
          renderPagination();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function openDetail(food) {
      selectedFood = food;
      $("#detailImage").src = food.image || fallbackImages[0];
      $("#detailName").textContent = food.name;
      $("#detailAddress").textContent = food.address;
      $("#detailDescription").textContent = food.description;
      $("#detailMenu").textContent = food.menu;
      $("#detailTel").textContent = food.tel;
      $("#detailTime").textContent = food.time;
      updateFavoriteDetailButton();
      openPage("detailPage");
      setTimeout(function () {
        renderMap(food);
      }, 120);
    }

    function openPage(pageId) {
      document.querySelectorAll(".page").forEach(function (page) {
        page.classList.remove("active");
      });

      $("#" + pageId).classList.add("active");

      document.querySelectorAll(".nav-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.page === pageId);
      });

      if (pageId === "favoritePage") {
        renderFavorites();
      }
    }

    function renderMap(food) {
      const mapEl = $("#map");

      if (!window.kakao || !window.kakao.maps) {
        mapEl.innerHTML = `<div class="empty-state">카카오 API 키를 입력하면 지도가 표시됩니다.</div>`;
        return;
      }

      const defaultLat = food.lat || 35.8242238;
      const defaultLng = food.lng || 127.1480005;
      const position = new kakao.maps.LatLng(defaultLat, defaultLng);

      map = new kakao.maps.Map(mapEl, {
        center: position,
        level: 4
      });

      marker = new kakao.maps.Marker({
        position: position,
        map: map
      });

      if (!food.lat || !food.lng) {
        const geocoder = new kakao.maps.services.Geocoder();
        geocoder.addressSearch(food.address, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
            food.lat = Number(result[0].y);
            food.lng = Number(result[0].x);
            map.setCenter(coords);
            marker.setPosition(coords);
          }
        });
      }
    }

    function openKakaoRoute() {
      if (!selectedFood) return;

      const name = encodeURIComponent(selectedFood.name);
      const lat = selectedFood.lat || 35.8242238;
      const lng = selectedFood.lng || 127.1480005;
      const url = `https://map.kakao.com/link/to/${name},${lat},${lng}`;
      window.open(url, "_blank");
    }

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem("jeonju-food-favorites")) || [];
      } catch (error) {
        return [];
      }
    }

    function setFavorites(ids) {
      localStorage.setItem("jeonju-food-favorites", JSON.stringify(ids));
    }

    function isFavorite(id) {
      return getFavorites().includes(id);
    }

    function toggleFavorite(id) {
      const favorites = getFavorites();
      const next = favorites.includes(id)
        ? favorites.filter(function (item) { return item !== id; })
        : favorites.concat(id);
      setFavorites(next);
    }

    function renderFavorites() {
      const ids = getFavorites();
      const items = foods.filter(function (food) {
        return ids.includes(food.id);
      });

      $("#favoriteCount").textContent = items.length;

      if (items.length === 0) {
        favoriteListEl.innerHTML = `<div class="empty-state">아직 저장한 맛집이 없습니다.</div>`;
        return;
      }

      favoriteListEl.innerHTML = items.map(createFoodCard).join("");
      bindFoodCardEvents(favoriteListEl);
    }

    function updateFavoriteDetailButton() {
      if (!selectedFood) return;
      $("#favoriteDetailBtn").textContent = isFavorite(selectedFood.id) ? "즐겨찾기 해제" : "즐겨찾기";
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    init();
  </script>
</body>
</html>
