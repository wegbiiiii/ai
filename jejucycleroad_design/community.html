<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제주 자전거길 커뮤니티</title>

  <link rel="stylesheet" href="./css/community.css" />

  <!-- Font Awesome Icon -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- Kakao Map SDK : KAKAO_JS_KEY를 본인 키로 변경 -->
  <script
    defer
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=KAKAO_JS_KEY&autoload=false"
  ></script>

  <script defer src="./script/community.js"></script>
</head>
<body>
  <div class="app">

    <!-- =========================
      COMMUNITY PAGE
    ========================== -->
    <main class="page community-page active" id="communityPage">

      <header class="top-header">
        <button type="button" class="header-btn" id="communityBackBtn"aria-label="뒤로가기">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <h1>커뮤니티</h1>

        <button type="button" class="profile-btn">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80" alt="프로필" />
        </button>
      </header>

      <section class="moment-section">
        <div class="section-title-row">
          <h2>지금 이 순간을 공유해주세요</h2>
          <a href="#" class="more-btn">더보기</a>
        </div>

        <div class="story-list">
          <article class="story-card">
            <img src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=300&q=80" alt="스토리 이미지" />
            <span class="story-profile">
              <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=80&q=80" alt="유저" />
            </span>
          </article>

          <article class="story-card">
            <img src="https://images.unsplash.com/photo-1532298229144-0ec0c57515c7?auto=format&fit=crop&w=300&q=80" alt="스토리 이미지" />
            <span class="story-profile">
              <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=80&q=80" alt="유저" />
            </span>
          </article>

          <article class="story-card">
            <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=300&q=80" alt="스토리 이미지" />
            <span class="story-profile">
              <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=80&q=80" alt="유저" />
            </span>
          </article>

          <article class="story-card">
            <img src="https://images.unsplash.com/photo-1516900557549-41557d405adf?auto=format&fit=crop&w=300&q=80" alt="스토리 이미지" />
            <span class="story-profile">
              <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=80&q=80" alt="유저" />
            </span>
          </article>

          <article class="story-card">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=300&q=80" alt="스토리 이미지" />
            <span class="story-profile">
              <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=80&q=80" alt="유저" />
            </span>
          </article>
        </div>
      </section>

      <section class="feed-section">
        <h2>내가 추천하는 제주자전거 길</h2>

        <div class="feed-list" id="feedList">
          <!-- JS에서 카드 생성 -->
        </div>
      </section>
    </main>

    <!-- =========================
      DETAIL PAGE
    ========================== -->
    <main class="page detail-page" id="detailPage">

      <header class="top-header detail-header">
        <button type="button" class="header-btn" id="detailBackBtn" aria-label="뒤로가기">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <h1 id="detailHeaderTitle">댕댕댕님의 커뮤니티 글</h1>

        <span class="header-space"></span>
      </header>

      <section class="roadmap-section">
        <div class="roadmap-img-box">
          <img
            src="#"
            alt="제주도 자전거길 로드맵"
          />
          
        </div>
      </section>

      <section class="detail-user-section">
        <div class="feed-user-row">
          <img id="detailAvatar" class="user-avatar" src="" alt="유저" />

          <div class="user-text">
            <div class="user-name-line">
              <strong id="detailUserName">댕댕댕</strong>
              <span class="level-badge">LV 00</span>
            </div>
            <p>10min</p>
          </div>
        </div>

        <h2 id="detailTitle">해거름마을 자전거도로</h2>
      </section>

      <section class="course-review-section">
        <h2>코스리뷰</h2>

        <article class="review-card">
          <img
            id="detailMainImage"
            class="review-main-img"
            src=""
            alt="코스 이미지"
          />

          

          <p class="review-desc" id="detailDesc">
            제주 해안도로를 따라 달릴 수 있는 자전거 코스입니다. 바다와 마을 풍경이 함께 보여서
            초보자도 부담 없이 즐길 수 있습니다. 휴식 지점과 사진 명소가 많아 커뮤니티 추천 코스로 적합합니다.
          </p>
        </article>
      </section>

      <section class="map-section">
        <h2>지도 위치</h2>
        <div id="kakaoMap"></div>

        <button type="button" class="route-btn" id="routeBtn">
          카카오맵 길찾기
        </button>
      </section>
    </main>


    <!-- =========================
  ALL MAP PAGE

<main class="page map-page" id="mapPage">
  <header class="top-header map-header">
    <button type="button" class="header-btn" id="mapBackBtn" aria-label="뒤로가기">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <h1>전체 지도</h1>

    <span class="header-space"></span>
  </header>

  <section class="all-map-section">
    <div class="all-map-title-box">
      <h2>제주도 자전거길 전체 지도</h2>
      <p>커뮤니티에서 추천한 자전거길 위치를 한눈에 확인해보세요.</p>
    </div>

    <div id="allKakaoMap"></div>

    <div class="map-course-list" id="mapCourseList">
      
    </div>
  </section>
</main>
========================== -->





    <!-- =========================
      BOTTOM NAV
    ========================== -->
    <nav class="bottom-nav">
      <a href="./main.html" class="nav-item">
        <img src="./images/home_symbol-2.svg" alt="홈">
        <span>홈</span>
      </a>

      <a href="#" class="nav-item active">
        <img src="./images/community_symbol-2.svg" alt="커뮤니티">
        <span>커뮤니티</span>
      </a>

      <a href="./course.html" class="nav-item">
        <img src="./images/map_symbol.svg" alt="코스">
        <span>코스</span>
      </a>

      <a href="#" class="nav-item">
        <img src="./images/crown_symbol.svg" alt="랭킹">
        <span>랭킹</span>
      </a>

      <a href="#" class="nav-item">
        <img src="./images/user_symbol.svg" alt="마이">
        <span>마이</span>
      </a>
    </nav>

  </div>
</body>
</html>
