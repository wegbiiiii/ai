<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>절대반지는?</title>
  <style>
    body {
      background-color: #ffffff;
      font-family: '맑은 고딕', 'Malgun Gothic', '돋움', Dotum, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
 
    h1 {
      color: red;
      font-size: 1.35rem;
      font-weight: bold;
      margin-bottom: 14px;
    }
 
    p {
      margin: 0;
      padding: 4px 0;
      font-size: 0.95rem;
      line-height: 1.75;
    }
 
    /* 각 hr은 위 텍스트 너비에 맞게 이미지 픽셀 분석 기반으로 설정 */
    /* 이미지 전체 너비 887px 기준 left%, right% 계산 */
 
    hr.hr1 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 320px;
    }
 
    hr.hr2 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 390px;
    }
 
    hr.hr3 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 280px;
    }
 
    hr.hr4 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 390px;
    }
 
    hr.hr5 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 390px;
    }
 
    hr.hr6 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 500px;
    }
 
    hr.hr7 {
      border: none;
      border-top: 1px solid #808080;
      margin: 2px auto;
      width: 420px;
    }
 
    .red    { color: #cc0000; }
    .orange { color: #cc6600; }
    .yellow { color: #999900; }
    .green  { color: #007700; }
    .blue   { color: #000099; }
    .purple { color: #660066; }
    .gold   { color: #cc9900; }
    .source { color: #cc0000; font-style: italic; font-size: 0.85rem; }
  </style>
</head>
<body>
 
  <h1>절대반지는?</h1>
 
  <p style="color: orange;">반지 세 개는 하늘 아래 요정왕들을 위한 것,</p>
  <hr class="hr1" />
 
  <p style="color: blue;">일곱 개는 돌의 전당에 있는 난쟁이 군주들을 위한 것,</p>
  <hr class="hr2" />
 
  <p style="color: yellowgreen;">아홉 개는 죽은 운명의 인간을 위한 것,</p>
  <hr class="hr3" />
 
  <p style="color: orange;">하나는 암흑의 왕좌에 앉은 암흑 제왕을 위한 것,</p>
  <hr class="hr4" />
 
  <p style="color: blue;">그곳은 망령들이 지배라는 모르도르의 땅,</p>
  <hr class="hr5" />
 
  <p style="color: yellowgreen;">그 모든 반지를 다스릴 반지하나, 그 모든 반지를 찾기 위한 절대반지,</p>
  <hr class="hr6" />
 
  <p style="color: orange;">그 모든 반지를 암흑 속에 가두기 위한 반지는 절대반지뿐,</p>
  <hr class="hr7" />
 
  <p style="color: blue;">바로 망령들이 누워 있는 모르도르의 땅에</p>
  <hr style="border: none; border-top: 1px solid #808080; margin: 2px 0; width: 100%;" />
 
  <p style="color: green; font-style: italic; font-size: 0.85rem;">반지의 제왕 중에서....</p>
 
</body>
</html>
