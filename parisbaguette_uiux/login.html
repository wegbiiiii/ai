<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>파리바게트 로그인</title>

  <link rel="stylesheet" href="./css/login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-wrap">

      <!-- 로고 영역 -->
      <div class="logo-area">
        <img src="./images/logo-2.png" alt="PARIS BAGUETTE 로고" />
      </div>

      <!-- 로그인 폼 -->
      <form class="login-form" id="loginForm">
        <div class="input-box">
          <input type="text" id="userId" placeholder="아이디" />
        </div>

        <div class="input-box">
          <input type="password" id="userPw" placeholder="비밀번호" />
        </div>

        <a href="./main.html" class="login-btn" id="loginBtn">로그인</a>

        <a href="./join.html" class="join-btn">회원가입</a>
      </form>

      <!-- 링크 메뉴 -->
      <ul class="find-menu">
        <li><a href="#">아이디 찾기</a></li>
        <li><a href="#">비밀번호 찾기</a></li>
        <li><a href="#">둘러보기</a></li>
      </ul>

      <!-- 간편 로그인 -->
      <div class="easy-login">
        <div class="easy-title">
          <span></span>
          <p>간편로그인</p>
          <span></span>
        </div>

        <ul class="sns-list">
          <li>
            <a href="#">
              <img src="./images/download_kakaotalk_logo.svg.svg" alt="카카오톡 로그인" />
            </a>
          </li>
          <li>
            <a href="#">
              <img src="./images/naver.svg" alt="네이버 로그인" />
            </a>
          </li>
          <li>
            <a href="#">
              <img src="./images/google.svg" alt="구글 로그인" />
            </a>
          </li>
          <li>
            <a href="#">
              <img src="./images/facebook.svg" alt="페이스북 로그인" />
            </a>
          </li>
        </ul>
      </div>

    </section>
  </main>

  <script src="./script/login.js"></script>
</body>
</html>
