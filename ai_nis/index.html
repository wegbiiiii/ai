<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전하고 평화로운 대한민국 - 국가정보원</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            background-color: #000;
        }

        /* 메인 컨테이너 */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 290px;
            padding-bottom: 80px;
            text-align: left;
            color: white; 
            overflow: hidden; /* 배경 이미지가 섹션을 벗어나지 않도록 설정 */
        }

        /* 배경 이미지 전용 스타일 */
        .background-image-root {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* 가장 뒤에 배치 */
        }

        .background-image-root img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 비율을 유지하며 전체를 채움 */
            object-position: center bottom;
            display: block;
        }

        /* 텍스트 영역 */
        .content-wrapper {
            position: relative; /* 배경보다 위에 배치하기 위해 relative 설정 */
            width: 100%;
            max-width: 1280px;
            padding: 0;
            z-index: 2; /* 배경 이미지보다 높은 z-index */
            margin-bottom: 50px;
        }

        /* 타이틀 행간을 74px로 수정 */
        .main-title, .sub-title {
            font-size: 50px;
            font-weight: 700;
            line-height: 74px; /* 행간 설정 */
            text-shadow: 0 2px 15px rgba(0,0,0,0.8); /* 이미지 위 가독성 확보 */
        }

        /* 카드 그리드 레이아웃 */
        .card-container {
            position: relative; /* 배경보다 위에 배치하기 위해 relative 설정 */
            display: flex;
            justify-content: center;
            gap: 40px; 
            width: 100%;
            max-width: 1280px;
            padding: 0;
            z-index: 2; /* 배경 이미지보다 높은 z-index */
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            cursor: pointer;
            width: 400px;
            flex-shrink: 0;
            border: none;
        }

        /* 이미지 컨테이너 및 효과 */
        .card-image-wrap {
            width: 100%;
            height: 240px;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .card:hover .card-image {
            transform: scale(1.2);
        }

        .card-footer {
            padding: 14px;
            text-align: center;
            background-color: #fff;
            color: #333;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* 모바일 대응 */
        @media (max-width: 1280px) {
            .content-wrapper, .card-container {
                padding: 0 20px; 
            }
            .card-container {
                gap: 20px;
            }
            .card {
                width: calc(33.33% - 14px);
            }
        }

        @media (max-width: 900px) {
            .hero-section {
                padding-top: 100px;
            }
            .main-title, .sub-title {
                font-size: 32px;
                line-height: 1.3; /* 모바일에서는 유연한 행간 적용 */
            }
            .card-container {
                flex-direction: column;
                align-items: center;
            }
            .card {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- 배경 이미지 태그 영역 -->
        <div class="background-image-root">
            <img src="./images/bg_about.jpg" alt="배경 이미지">
        </div>

        <!-- 텍스트 콘텐츠 -->
        <div class="content-wrapper">
            <h1 class="main-title">안전하고 평화로운 대한민국을 위해</h1>
            <p class="sub-title">국가정보원이 함께합니다.</p>
        </div>

        <!-- 하단 카드 메뉴 -->
        <div class="card-container">
            <div class="card">
                <div class="card-image-wrap">
                    <img src="./images/img_about_1.jpg" alt="직무" class="card-image">
                </div>
                <div class="card-footer">직무</div>
            </div>

            <div class="card">
                <div class="card-image-wrap">
                    <img src="./images/img_about_2.png" alt="국정원 역사" class="card-image">
                </div>
                <div class="card-footer">국정원 역사</div>
            </div>

            <div class="card">
                <div class="card-image-wrap">
                    <img src="./images/img_about_3.jpg" alt="관련 법령" class="card-image">
                </div>
                <div class="card-footer">관련 법령</div>
            </div>
        </div>
    </section>

</body>
</html>
