<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체데이터</title>
</head>
<body>
    <!--객체를 선언하는 방법-->
    <!--객체에 접근해서 data를 가져와서(접근) -->
    <!--객체변수명.key값-->
    <!--key값은 개발자가 만들어서 사용한다-->
    
    <script>
        //배열로 선언
        let score = [100, 90, 80, 70];

        document.write(`국어점수 = ${score[0]}<br>영어점수 = ${score[1]}<br>수학점수 = ${score[2]}<br>과학점수 = ${score[3]}<br>`);

        //객체로 선언
        let scores = {
            kor:100,
            eng:90,
            math:80,
            science:70,
        };

        console.log(scores);

        document.write(`<br>영어점수 = ${scores.eng}`);
        document.write(`<br>과학점수 = ${scores.science}`);
        document.write(`<br>국어점수 = ${scores.kor}`);
        document.write(`<br>수학점수 = ${scores.math}`);
</script>
</body>
</html>
