<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채혜진의 홈페이지</title>
    <style>
        body {
            font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
            text-align: center;
            background-color: #ffffff;
            color: #000000;
        }
 
        h1 {
            color: #008000;
            font-size: 24px;
        }
 
        .intro {
            font-size: 14px;
            line-height: 2;
            color: #000000;
        }
 
        .contact {
            font-size: 14px;
            line-height: 2;
            color: #000000;
        }
 
        .email {
            color: #ff0000;
            text-decoration: underline;
        }
 
        .date {
            font-size: 14px;
            color: #000000;
        }
 
        hr.thin {
            border: none;
            width: 300px;
            height: 6px;
            background-color: blue;
        }
 
        h2 {
            color: #008000;
            font-size: 22px;
        }
    </style>
</head>
<body>
 
    <h1>최정근의 홈페이지에 오신 것을 환영합니다.</h1>
 
    <p class="intro">
        멋진 홈페이지가 되도록 노력하겠습니다.<br>
        부디 저의 홈페이지에서 좋은 시간 가지시기 바라며<br>
        가실 때에 따뜻한 글한마디 남겨주시면 감사하겠습니다.
    </p>
 
    <p class="contact">
        그리고 제 홈페이지에 궁금한 점이 있으시면<br>
        <a class="email" href="mailto:xxxxx@naver.com"><em>xxxxx@naver.com</em></a>으로<br>
        메일 보내주시기 바랍니다.
    </p>
 
    <p class="date">2026년 3월 23일</p>
 
    <hr class="thin">
 
    <h2>KD아카데미학원 강의실에서</h2>
 
    <hr class="thin">
 
</body>
</html>
