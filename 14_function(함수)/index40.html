<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리턴문</title>
</head>
<body>
    <script>
        // return = 값을 반환, 함수를 중지

        //return 문만 있을때 함수를 중지

        //return 반환할 변수 

        //제곱근을 구하는 함수
        //매개변수는 숫자 데이터

        //return 값은 계산된 결과를 호출한 명령에 되돌려 준다

        function sqr(x) {
            return x*x;
            
        };

        document.write(sqr(10));


    </script>
</body>
</html>
