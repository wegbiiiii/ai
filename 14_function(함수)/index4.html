<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이름없는 함수 선언</title>
</head>
<body>
    <script>
        let hi = function(){
            //실행 할 함수기능 코딩
            alert("안녕하세요");
        };


        hi();

    </script>
</body>
</html>
