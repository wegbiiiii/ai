<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모바일 온보딩 슬라이드</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #ffffff;
      color: #42557f;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 393px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .onboarding-swiper {
      width: 100%;
      height: 100vh;
    }

    .swiper-slide {
      width: 100%;
      height: 100%;
      padding: 145px 18px 36px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #ffffff;
    }

    .text-box {
      width: 100%;
      min-height: 145px;
      position: relative;
      z-index: 2;
    }

    .slide-title {
      font-size: 28px;
      line-height: 1.34;
      font-weight: 800;
      letter-spacing: -1px;
      color: #42557f;
    }

    .slide-title .light {
      color: #7f94c7;
      font-weight: 800;
    }

    .slide-desc {
      margin-top: 18px;
      font-size: 17px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: #91a3cf;
    }

    .image-area {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 118px;
    }

    .slide-image {
      width: 78%;
      max-width: 290px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .slide-image.type-2 {
      width: 82%;
      max-width: 300px;
    }

    .slide-image.type-3 {
      width: 86%;
      max-width: 315px;
    }

    .swiper-pagination {
      bottom: 136px !important;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .swiper-pagination-bullet {
      width: 10px;
      height: 10px;
      margin: 0 !important;
      background: #e8edf8;
      opacity: 1;
    }

    .swiper-pagination-bullet-active {
      background: #5b74bd;
    }

    .start-button {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 36px;
      height: 49px;
      border-radius: 9px;
      background: #526db6;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.2px;
      z-index: 10;
      transition: 0.2s ease;
    }

    .start-button:active {
      transform: scale(0.98);
      background: #455fa6;
    }

    @media (max-width: 360px) {
      .swiper-slide {
        padding: 120px 18px 30px;
      }

      .slide-title {
        font-size: 25px;
      }

      .slide-desc {
        font-size: 15px;
      }

      .swiper-pagination {
        bottom: 122px !important;
      }

      .start-button {
        bottom: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="swiper onboarding-swiper">
      <div class="swiper-wrapper">
        <!-- 1번 슬라이드 -->
        <section class="swiper-slide">
          <div class="text-box">
            <h1 class="slide-title">
              차박,<br />
              어디로 <span class="light">떠나야 할지 모르겠나요?</span>
            </h1>
            <p class="slide-desc">
              지도기반 위치 앱 및 키워드 검색으로 내가 원하는 장소를 한번에!
            </p>
          </div>

          <div class="image-area">
            <!-- src만 원하는 이미지 경로로 변경해서 사용하세요. -->
            <img class="slide-image" src="./images/Frame 10.png" alt="차박 장소 검색 안내 이미지" />
          </div>
        </section>

        <!-- 2번 슬라이드 -->
        <section class="swiper-slide">
          <div class="text-box">
            <h1 class="slide-title">
              차만 있다면<br />
              장비는 <span class="light">부담적은</span> 렌탈로
            </h1>
            <p class="slide-desc">
              차박에 필요한 물품들을 용도 별로 둘러봐요
            </p>
          </div>

          <div class="image-area">
            <img class="slide-image type-2" src="./images/Frame 11.png" alt="차박 장비 렌탈 안내 이미지" />
          </div>
        </section>

        <!-- 3번 슬라이드 -->
        <section class="swiper-slide">
          <div class="text-box">
            <h1 class="slide-title">
              일상이 바쁠 땐 실시간<br />
              라이브로 대리만족 <span class="light">하세요</span>
            </h1>
            <p class="slide-desc">
              라이브로 나를 뽐내고 시청자들과 소통하는 즐거움!
            </p>
          </div>

          <div class="image-area">
            <img class="slide-image type-3" src="./images/Frame 12.png" alt="차박 라이브 소통 안내 이미지" />
          </div>
        </section>
      </div>

      <div class="swiper-pagination"></div>
    </div>

    <!-- 로그인 페이지 경로로 href만 변경해서 사용하세요. -->
    <a href="./login.html" class="start-button">시작하기</a>
  </main>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const onboardingSwiper = new Swiper(".onboarding-swiper", {
      loop: true,
      speed: 500,
      autoplay: {
        delay:2000,
        disableOnInteraction: false,
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
    });
  </script>
</body>
</html>
