<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if 제1형식</title>
</head>
<body>
    <script>
        //1. if문(조건문) 제 1형식
        let score = prompt('점수를 입력하세요');
        if(score>=80) {
            alert("합격");
        }
        
    </script>
</body>
</html>
