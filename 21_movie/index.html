<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동영상 삽입</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>홍보/마케팅 동영상</h1>
    <hr>
    <div class="imgbox">
        <img src="./images/5.png" alt="샘플이미지">
    </div>

    <div class="movi_wrap">
        <div class="movi">
            <video autoplay muted loop controls="true">
                <source src="./movi/sample_1.mp4" type="video/mp4"/>
            </video>
        </div>
        <div class="movi">
            <video autoplay muted loop controls="true">
                <source src="./movi/sample_2.mp4" type="video/mp4"/>
            </video>
        </div>
        <div class="movi">
            <video autoplay muted loop controls="true">
                <source src="./movi/sample_3.mp4" type="video/mp4"/>
            </video>
        </div>
        <div class="movi">
            <video autoplay muted loop controls="true">
                <source src="./movi/sample_4.mp4" type="video/mp4"/>
            </video>
        </div>
    </div>

    <!--유튜브 영상 삽입-->
    <div class="youtube">
        <iframe src="https://www.youtube.com/embed/h0TJoAaulgI?si=4EDTtrL7eDbW0KZs" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen></iframe>
    </div>
</body>
</html>
