<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제주환상 자전거길 로그인</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      border: none;
      outline: none;
      font-family: inherit;
    }

    .mobile-login {
      width: 375px;
      min-height: 812px;
      margin: 0 auto;
      background: #fff;
      padding: 150px 24px 0;
    }

    .logo-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 70px;
    }

    .logo-area img {
      width: 208px;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .login-form {
      width: 100%;
    }

    .input-box {
      width: 100%;
      height: 48px;
      margin-bottom: 9px;
      padding: 0 16px;
      border-radius: 8px;
      background: #ddd;
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    .input-box::placeholder {
      color: #999;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 34px;
      margin-top: 10px;
      margin-bottom: 34px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #444;
      cursor: pointer;
      user-select: none;
    }

    .check-label input {
      display: none;
    }

    .custom-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #d8d8d8;
      position: relative;
      background: #fff;
    }

    .check-label input:checked + .custom-check {
      background: #ffad00;
      border-color: #ffad00;
    }

    .check-label input:checked + .custom-check::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 10px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: translate(-50%, -55%) rotate(45deg);
}

    .login-btn {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      background: #ffad00;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .member-menu {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;
      margin-top: 30px;
      font-size: 13px;
      color: #8b8b8b;
      font-weight: 700;
    }

    .member-menu .bar {
      width: 1px;
      height: 14px;
      background: #bdbdbd;
    }

    .or-box {
      display: flex;
      align-items: center;
      gap: 26px;
      margin-top: 55px;
      color: #bdbdbd;
      font-size: 13px;
    }

    .or-box::before,
    .or-box::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }

    .sns-list {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 33px;
      margin-top: 68px;
      list-style: none;
    }

    .sns-list li a {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      height: 24px;
    }

    .sns-list img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <div class="mobile-login">
    <div class="logo-area">
      <img src="./images/logo2.svg" alt="제주환상 자전거길 로고" />
    </div>

    <form class="login-form" id="loginForm">
      <input
        type="text"
        class="input-box"
        id="userId"
        placeholder="아이디 또는 이메일을 입력해주세요."
      />

      <input
        type="password"
        class="input-box"
        id="userPw"
        placeholder="비밀번호를 입력해주세요."
      />

      <div class="option-row">
        <label class="check-label">
          <input type="checkbox" checked />
          <span class="custom-check"></span>
          <span>자동 로그인</span>
        </label>

        <label class="check-label">
          <input type="checkbox" />
          <span class="custom-check"></span>
          <span>아이디 저장</span>
        </label>
      </div>

      <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="member-menu">
      <a href="#">아이디 찾기</a>
      <span class="bar"></span>
      <a href="#">비밀번호 찾기</a>
      <span class="bar"></span>
      <a href="#">회원가입</a>
    </div>

    <div class="or-box">Or</div>

    <ul class="sns-list">
      <li>
        <a href="#">
          <img src="./images/kakaolog.png" alt="카카오톡 로그인" />
        </a>
      </li>
      <li>
        <a href="#">
          <img src="./images/naverlog.png" alt="네이버 로그인" />
        </a>
      </li>
      <li>
        <a href="#">
          <img src="./images/facebooklog.png" alt="페이스북 로그인" />
        </a>
      </li>
    </ul>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const userId = document.getElementById("userId");
    const userPw = document.getElementById("userPw");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      if (userId.value.trim() === "") {
        alert("아이디 또는 이메일을 입력해주세요.");
        userId.focus();
        return;
      }

      if (userPw.value.trim() === "") {
        alert("비밀번호를 입력해주세요.");
        userPw.focus();
        return;
      }

      location.href = "./main.html";
    });
  </script>
</body>
</html>
