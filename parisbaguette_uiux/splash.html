<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paris Baguette Splash</title>
  <link rel="stylesheet" href="./css/splash.css" />
</head>
<body>

  <main class="splash-wrap">
    <section class="splash-screen">

      <!-- 로고 이미지 영역 -->
      <div class="logo-area">
        <!-- 원하는 로고 이미지로 src만 변경 -->
        <img src="./images/logo.png" alt="PARIS BAGUETTE 로고" />
      </div>

      <!-- 로딩 영역 -->
      <div class="loading-area">
        <div class="loading-bar">
          <span class="loading-progress"></span>
        </div>
        <p class="loading-percent">0%</p>
      </div>

      <!-- 이동할 임의 링크 -->
      <a href="./slide.html" class="move-link" id="moveLink">메인으로 이동</a>

    </section>
  </main>

  <script src="./script/splash.js"></script>
</body>
</html>
