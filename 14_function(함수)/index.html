<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수 선언 및 실행</title>
</head>
<body>
    <script>
        // 함수(컴포넌트) 선언(만드는) 방식
        function test(){
            //실행 할 함수기능 코딩
            alert("안녕하세요");
        }
        //함수를 실행
        test();
        test();

    </script>
</body>
</html>
