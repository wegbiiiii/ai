<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page - Soft Minimal Chic Shop</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="page-header">
            <h1 class="page-title">My Page</h1>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- User Profile -->
            <section class="user-profile-section">
                <div class="user-profile-card">
                    <div class="user-avatar">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="1.5">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div class="user-info">
                        <h2 class="user-name">김소피아</h2>
                        <p class="user-email">sophia.kim@email.com</p>
                    </div>
                    <button class="edit-profile-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Order Status -->
            <section class="order-status-section">
                <h3 class="my-section-title">주문 현황</h3>
                <div class="order-status-grid">
                    <div class="order-status-item">
                        <p class="order-status-count">2</p>
                        <p class="order-status-label">배송 준비중</p>
                    </div>
                    <div class="order-status-item">
                        <p class="order-status-count">1</p>
                        <p class="order-status-label">배송중</p>
                    </div>
                    <div class="order-status-item">
                        <p class="order-status-count">0</p>
                        <p class="order-status-label">배송 완료</p>
                    </div>
                    <div class="order-status-item">
                        <p class="order-status-count">0</p>
                        <p class="order-status-label">교환/반품</p>
                    </div>
                </div>
            </section>

            <!-- Menu List -->
            <section class="my-menu-section">
                <h3 class="my-section-title">쇼핑 정보</h3>
                <div class="my-menu-list">
                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <circle cx="9" cy="21" r="1"/>
                                <circle cx="20" cy="21" r="1"/>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">주문 내역</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">위시리스트</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                <polyline points="14 2 14 8 20 8"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">리뷰 관리</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">쿠폰함</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>
                </div>
            </section>

            <!-- Settings Menu -->
            <section class="my-menu-section">
                <h3 class="my-section-title">설정</h3>
                <div class="my-menu-list">
                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                                <path d="M12 17h.01"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">공지사항</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
                                <path d="M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">고객센터</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>

                    <a href="#" class="my-menu-item">
                        <div class="my-menu-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--point-color)" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M12 1v6m0 6v6"/>
                                <path d="m12 12 5.2 3m-10.4 0L12 12"/>
                                <path d="m12 12 5.2-3m-10.4 0L12 12"/>
                            </svg>
                        </div>
                        <span class="my-menu-text">앱 설정</span>
                        <svg class="my-menu-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </a>
                </div>
            </section>

            <!-- Logout Button -->
            <section class="logout-section">
                <button class="logout-button">로그아웃</button>
            </section>

            <!-- Empty space for tab bar -->
            <div style="height: 40px;"></div>
        </div>

        <!-- Bottom Tab Bar -->
        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-button" data-tab="home">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="tab-label">Home</span>
            </a>
            <a href="category.html" class="tab-button" data-tab="category">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect width="7" height="7" x="3" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="14" rx="1"/>
                    <rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
                <span class="tab-label">Category</span>
            </a>
            <a href="cart.html" class="tab-button" data-tab="cart">
                <div class="tab-icon-wrapper">
                    <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <span class="wishlist-badge" id="wishlist-badge" style="display: none;">0</span>
                </div>
                <span class="tab-label">Cart</span>
            </a>
            <a href="my.html" class="tab-button active" data-tab="my">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="tab-label">My</span>
            </a>
        </nav>
    </div>

    <script src="./script/script.js"></script>
</body>
</html>
