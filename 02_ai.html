<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>최정근 홈페이지</title>
  <style>
    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #f7f9fc;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: min(90%, 800px);
      background: white;
      padding: 48px 36px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      line-height: 1.9;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 28px;
      color: #000;
    }

    h2 {
      font-size: 1.4rem;
      margin-top: 36px;
      color: #444;
    }

    p {
      font-size: 1.05rem;
      margin: 20px 0;
      white-space: pre-line;
    }

    .date {
      margin-top: 24px;
      font-weight: bold;
      color: #666;
    }

    .email {
      color: #1a73e8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>최정근 홈페이지에 오신 것을 환영합니다.</h1>

    <p>
멋진 홈페이지가 되도록 노력.
부디 저의 홈페이지에서 좋은 시간 가지시기 바라며
가실 때에 따듯한 글을 남겨주시면 감사하겠습니다
    </p>

    <p>
그리고 제 홈페이지에 궁금한 점이 있으시면
<span class="email">sssss@naver.com</span>으로
메일 보내주시기 바랍니다.
    </p>

    <p class="date">2026년 3월 19일</p>

    <h2>이젠 컴퓨터학원 강의실에서</h2>
  </div>
</body>
</html>
