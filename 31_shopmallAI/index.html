<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Layout 1200</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ececec;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-box {
      width: 1200px;
      height: 150px;
      background: #cfcfcf;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      width: 350px;
      height: 60px;
      background: #cf8b54;
    }

    .logo-box {
      width: 350px;
      height: 70px;
      background: #b6f46b;
    }

    .right-box {
      width: 350px;
      height: 90px;
      background: #7b3ff2;
    }

    .red-band {
      width: 100%;
      height: 450px;
      background: #ff0d00;
    }

    .blue-box {
      width: 1200px;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: transparent;
    }

    .blue-box__section {
      width: 100%;
    }

    .side-dish-box {
      height: 1000px;
      background: #f000ff;
    }

    .regular-side-dish-box {
      height: 600px;
      background: #ffad00;
    }

    .new-side-dish-box {
      height: 1000px;
      background: #1fd9de;
    }

    .banner-box {
      height: 200px;
      background: #ff6400;
    }

    .md-recommend-side-dish-box {
      height: 1000px;
      background: #f000ff;
    }

    .green-box {
      width: 1200px;
      height: 200px;
      background: #2dff00;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left-box {
      width: 385px;
      height: 125px;
      background: #89a868;
    }

    .footer-right-box {
      width: 775px;
      height: 125px;
      background: #7b3f3f;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top-box">
      <div class="search-box"></div>
      <div class="logo-box"></div>
      <div class="right-box"></div>
    </header>

    <section class="red-band"></section>

    <main class="blue-box">
      <div class="blue-box__section side-dish-box"></div>
      <div class="blue-box__section regular-side-dish-box"></div>
      <div class="blue-box__section new-side-dish-box"></div>
      <div class="blue-box__section banner-box"></div>
      <div class="blue-box__section md-recommend-side-dish-box"></div>
    </main>

    <footer class="green-box">
      <div class="footer-left-box"></div>
      <div class="footer-right-box"></div>
    </footer>
  </div>
</body>
</html>
