<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Box Model Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: #f2cd00;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    .side-box {
      width: 100px;
      border: 1px solid #000;
    }

    .box {
      width: 100%;
      height: 100px;
      border-bottom: 1px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #000;
    }

    .box:last-child {
      border-bottom: 0;
    }

    .red {
      background: #ff1200;
    }

    .orange {
      background: #ffa500;
    }

    .yellow {
      background: #ffff00;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="side-box">
      <div class="box red">빨</div>
      <div class="box orange">주</div>
      <div class="box yellow">노</div>
    </div>
  </div>
</body>
</html>
