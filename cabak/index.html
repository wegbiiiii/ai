<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>전국 캠핑장 검색 서비스</title>

  <!-- 카카오 JavaScript 키만 교체하세요. -->
  <script defer src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ba55f074c6737f19be5b6e2e4944c6ec&autoload=false"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #4f69b2;
      --text: #171717;
      --gray: #777;
      --line: #d7d7d7;
      --bg: #fff;
      --safe-bottom: env(safe-area-inset-bottom);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      background: #f2f2f2;
      color: var(--text);
    }

    button, input {
      font-family: inherit;
      border: 0;
      background: none;
      outline: none;
    }

    button { cursor: pointer; }

    .app {
      width: 100%;
      max-width: 375px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .app::-webkit-scrollbar {
      display: none;
    }

    .screen {
      display: none;
      min-height: 100%;
      padding-bottom: calc(92px + var(--safe-bottom));
      background: #fff;
    }

    .screen.active { display: block; }


    .top-search {
      margin-top: 16px;
      height: 44px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-form {
      flex: 1;
      height: 38px;
      border: 2px solid var(--primary);
      border-radius: 6px;
      padding: 0 12px;
      display: flex;
      align-items: center;
    }

    .search-form input {
      width: 100%;
      height: 100%;
      font-size: 14px;
      font-weight: 600;
    }

    .search-form input::placeholder { color: #b7b7b7; }

    .map-btn {
      width: 28px;
      height: 28px;
      color: var(--primary);
    }

    .section-block { padding: 24px 24px 0; }

    .section-head {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .edit-btn {
      font-size: 10px;
      color: #333;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
    }

    .chip {
      min-width: 80px;
      height: 36px;
      padding: 0 18px;
      border-radius: 12px;
      background: #8b8b8b;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    .chip.primary { background: var(--primary); }

    .popular { margin-top: 50px; }

    .banner-box {
        height: 120px;
      margin-top: 108px;
      position: relative;
      overflow: hidden;
      /*background: linear-gradient(135deg, #d7efff 0%, #fff0cf 100%);*/
    }

    .banner-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 1px 0 #fff;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 50;
      width: 100%;
      max-width: 375px;
      height: calc(92px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #fff;
      border-top: 1px solid #777;
    }

    .nav-item {
      height: 70px;
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #555;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      stroke-width: 2.1;
    }

    .nav-item.active { color: var(--primary); }

    .page-header {
      height: 48px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      border-bottom: 1px solid #2f2f2f;
    }

    .page-header.no-line { border-bottom: 0; }

    .back-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn svg {
      width: 25px;
      height: 25px;
    }

    .page-title {
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .result-meta {
      padding: 10px 24px;
      font-size: 12px;
      color: #666;
      border-bottom: 1px solid #eee;
    }

    .result-card {
      position: relative;
      width: 100%;
      min-height: 112px;
      padding: 12px 24px;
      display: grid;
      grid-template-columns: 88px 1fr 32px;
      gap: 10px;
      background: #fff;
      border-bottom: 1px solid #cfcfcf;
      text-align: left;
    }

    .result-thumb {
      width: 88px;
      height: 88px;
      border-radius: 7px;
      overflow: hidden;
      background: #ddd;
    }

    .result-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-empty {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e5e5;
      color: #888;
      font-size: 10px;
    }

    .result-info { min-width: 0; padding-top: 2px; }

    .result-title {
      display: block;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-addr {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-row {
      margin-top: 12px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .badge {
      min-width: 54px;
      height: 18px;
      padding: 0 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
    }

    .distance {
      position: absolute;
      right: 24px;
      bottom: 28px;
      color: var(--primary);
      font-size: 15px;
      font-weight: 900;
    }

    .bookmark {
      position: absolute;
      right: 26px;
      top: 15px;
      z-index: 5;
      width: 18px;
      height: 22px;
      color: #111;
    }

    .bookmark svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: block;
    }

    .bookmark.saved svg {
      fill: var(--primary);
      stroke: var(--primary);
    }

    .loading-box,
    .empty-box,
    .error-box {
      min-height: 250px;
      padding: 60px 30px;
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty-action {
      width: 150px;
      height: 38px;
      margin-top: 16px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .more-btn {
      width: calc(100% - 48px);
      height: 44px;
      margin: 18px 24px 10px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
    }

    .detail-hero {
      width: 100%;
      height: 237px;
      overflow: hidden;
      background: #ddd;
    }

    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-body { padding: 22px 24px 24px; }

    .detail-title-row {
      display: grid;
      grid-template-columns: 1fr 26px;
      gap: 10px;
      align-items: start;
    }

    .detail-title-row .bookmark {
      position: static;
      width: 18px;
      height: 23px;
      margin-top: 2px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.4px;
    }

    .detail-addr {
      margin-top: 9px;
      color: #333;
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-section-title {
      margin-top: 25px;
      font-size: 14px;
      font-weight: 600;
    }

    .facility-grid {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .facility-card {
      width: 64px;
      height: 60px;
      border: 1.6px solid var(--primary);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--primary);
      font-size: 10px;
      font-weight: 600;
    }

    .facility-card svg {
      width: 22px;
      height: 22px;
    }

    .keyword-row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      line-height: 1.8;
    }

    .map-box {
      width: 100%;
      height: 220px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
    }

    .route-btn {
      width: 100%;
      height: 42px;
      margin-top: 10px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .info-list { margin-top: 14px; border-top: 1px solid #eee; }

    .info-row {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #eee;
      font-size: 12px;
      line-height: 1.55;
    }

    .info-row dt { color: #777; font-weight: 900; }
    .info-row dd { color: #252525; word-break: keep-all; }

    .related-image {
      margin-top: 12px;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: #eee;
    }

    .related-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }


    .toast {
      position: fixed;
      left: 50%;
      bottom: 105px;
      transform: translateX(-50%) translateY(20px);
      z-index: 100;
      max-width: 310px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="searchScreen" class="screen active">

      <div class="top-search">
        <form id="searchForm" class="search-form">
          <input id="searchInput" type="search" placeholder="지역 또는 키워드를 입력하세요" autocomplete="off" />
        </form>
        <button id="mapGuideBtn" class="map-btn" type="button" aria-label="지도 보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>
        </button>
      </div>

      <div class="section-block">
        <div class="section-head">
          <h2 class="section-title">최근 검색어</h2>
          <button id="clearRecentBtn" class="edit-btn" type="button">수정</button>
        </div>
        <div id="recentChips" class="chip-row"></div>
      </div>

      <div class="section-block popular">
        <h2 class="section-title">인기 키워드</h2>
        <div class="chip-row" style="margin-top: 12px;">
          <button class="chip primary keyword-btn" type="button">강원도</button>
          <button class="chip primary keyword-btn" type="button">일산</button>
        </div>
      </div>

      <div class="banner-box">
        <!-- 배너 이미지를 넣으려면 src에 이미지 경로를 입력하세요. 예: images/banner.jpg -->
        <img id="mainBanner" src="./images/minibanner.png" alt="캠핑 배너" hidden />
        <div id="bannerPlaceholder" class="banner-placeholder">여름 차박지 추천전</div>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <header class="page-header">
        <button class="back-btn" type="button" data-goto="searchScreen" aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19 8 12l7-7"/></svg></button>
        <h1 class="page-title">검색 결과</h1>
        <span></span>
      </header>
      <div id="resultMeta" class="result-meta">검색어를 입력해 주세요.</div>
      <div id="resultList" class="result-list"></div>
      <button id="moreBtn" class="more-btn" type="button" hidden>더보기</button>
    </section>

    <section id="favoriteScreen" class="screen">
      <header class="page-header">
        <button class="back-btn" type="button" data-goto="searchScreen" aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19 8 12l7-7"/></svg></button>
        <h1 class="page-title">즐겨찾기</h1>
        <span></span>
      </header>
      <div id="favoriteMeta" class="result-meta">저장한 캠핑장 0건</div>
      <div id="favoriteList" class="result-list"></div>
    </section>

    <section id="detailScreen" class="screen">
      <header class="page-header no-line">
        <button id="detailBackBtn" class="back-btn" type="button" aria-label="뒤로가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19 8 12l7-7"/></svg></button>
        <h1 id="detailHeaderTitle" class="page-title">캠핑장 상세</h1>
        <span></span>
      </header>

      <div id="detailHero" class="detail-hero"></div>
      <div class="detail-body">
        <div class="detail-title-row">
          <div>
            <h2 id="detailTitle" class="detail-title"></h2>
            <p id="detailAddr" class="detail-addr"></p>
          </div>
          <button id="detailBookmarkBtn" class="bookmark" type="button" aria-label="즐겨찾기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>
          </button>
        </div>

        <h3 class="detail-section-title">편의시설 위치보기</h3>
        <div id="facilityGrid" class="facility-grid"></div>

        <h3 class="detail-section-title">키워드</h3>
        <div id="keywordRow" class="keyword-row"></div>

        <h3 class="detail-section-title">지도</h3>
        <div id="detailMap" class="map-box"></div>
        <button id="routeBtn" class="route-btn" type="button">카카오맵 길찾기</button>

        <h3 class="detail-section-title">상세 정보</h3>
        <dl id="infoList" class="info-list"></dl>

        <h3 class="detail-section-title">관련 이미지</h3>
        <div id="relatedImage" class="related-image"></div>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item" type="button" data-goto="searchScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10.5 12 3l9 7.5V21H5v-8h14"/></svg><span>홈</span></button>
      <button class="nav-item active" type="button" data-goto="searchScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>검색</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="8" cy="19" r="2"/><circle cx="16" cy="19" r="2"/></svg><span>모임</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 8h16v12H4z"/><path d="M10 13l4 2-4 2v-4Z"/></svg><span>LIVE</span></button>
      <button id="favoriteNavBtn" class="nav-item" type="button" data-goto="favoriteScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/></svg><span>MY</span></button>
    </nav>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const SERVICE_KEY = "de187fd45d650881be9a659b12d26ea56f75c3bb95e5dedc89b25cd5a1ae692b";
    const GO_CAMPING_BASE_URL = "https://apis.data.go.kr/B551011/GoCamping";
    const MOBILE_OS = "ETC";
    const MOBILE_APP = "CampingSearchApp";

    const state = {
      keyword: "",
      pageNo: 1,
      numOfRows: 10,
      totalCount: 0,
      items: [],
      favorites: [],
      selected: null,
      previousScreen: "resultScreen",
      userPosition: null,
      map: null,
      marker: null
    };

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);

    function showScreen(screenId) {
      $$(".screen").forEach((screen) => screen.classList.remove("active"));
      const target = $("#" + screenId);
      if (target) target.classList.add("active");
      updateNav(screenId);
      document.querySelector(".app").scrollTo({ top: 0, behavior: "auto" });
    }

    function updateNav(screenId) {
      $$(".nav-item").forEach((item) => item.classList.remove("active"));
      if (screenId === "favoriteScreen") {
        $("#favoriteNavBtn")?.classList.add("active");
      } else {
        $$('.nav-item[data-goto="searchScreen"]')[1]?.classList.add("active");
      }
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function escapeHTML(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function compact(value, fallback = "정보 없음") {
      const text = String(value ?? "").trim();
      return text ? text : fallback;
    }

    function getItemKey(item) {
      return String(item?.contentId || `${item?.facltNm || ""}_${item?.addr1 || ""}`);
    }

    function loadFavorites() {
      try {
        state.favorites = JSON.parse(localStorage.getItem("camping_favorites") || "[]");
      } catch (error) {
        state.favorites = [];
      }
    }

    function saveFavorites() {
      localStorage.setItem("camping_favorites", JSON.stringify(state.favorites));
      renderFavoriteList();
      updateBookmarkUI();
    }

    function isFavorite(item) {
      const key = getItemKey(item);
      return state.favorites.some((favorite) => getItemKey(favorite) === key);
    }

    function toggleFavorite(item) {
      if (!item) return;

      if (isFavorite(item)) {
        const key = getItemKey(item);
        state.favorites = state.favorites.filter((favorite) => getItemKey(favorite) !== key);
        showToast("즐겨찾기를 해제했습니다.");
      } else {
        state.favorites = [{ ...item }, ...state.favorites].slice(0, 100);
        showToast("즐겨찾기에 저장했습니다.");
      }

      saveFavorites();
    }

    function updateBookmarkUI() {
      $$(".bookmark[data-key]").forEach((bookmark) => {
        const key = bookmark.dataset.key;
        const saved = state.favorites.some((favorite) => getItemKey(favorite) === key);
        bookmark.classList.toggle("saved", saved);
      });

      const detailBookmark = $("#detailBookmarkBtn");
      if (detailBookmark && state.selected) {
        detailBookmark.classList.toggle("saved", isFavorite(state.selected));
      }
    }

    function getRecentKeywords() {
      try {
        return JSON.parse(localStorage.getItem("camping_recent_keywords") || "[]");
      } catch (error) {
        return [];
      }
    }

    function setRecentKeywords(keywords) {
      localStorage.setItem("camping_recent_keywords", JSON.stringify(keywords.slice(0, 8)));
      renderRecentKeywords();
    }

    function addRecentKeyword(keyword) {
      const clean = keyword.trim();
      if (!clean) return;
      const list = getRecentKeywords().filter((word) => word !== clean);
      list.unshift(clean);
      setRecentKeywords(list);
    }

    function renderRecentKeywords() {
      const wrap = $("#recentChips");
      const keywords = getRecentKeywords();
      if (!keywords.length) {
        wrap.innerHTML = "";
        return;
      }

      wrap.innerHTML = keywords.map((word) => `<button class="chip recent-btn" type="button">${escapeHTML(word)}</button>`).join("");
    }

    function createURL(endpoint, params = {}) {
      const url = new URL(`${GO_CAMPING_BASE_URL}/${endpoint}`);
      const baseParams = {
        serviceKey: SERVICE_KEY,
        MobileOS: MOBILE_OS,
        MobileApp: MOBILE_APP,
        _type: "json"
      };

      Object.entries({ ...baseParams, ...params }).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") {
          url.searchParams.set(key, value);
        }
      });

      return url.toString();
    }

    async function fetchGoCamping(endpoint, params) {
      if (!SERVICE_KEY || SERVICE_KEY === "YOUR_PUBLIC_DATA_SERVICE_KEY") {
        throw new Error("SERVICE_KEY에 공공데이터포털 일반 인증키를 입력하세요.");
      }

      const response = await fetch(createURL(endpoint, params));
      if (!response.ok) throw new Error(`API 요청 실패: ${response.status}`);

      const data = await response.json();
      const header = data?.response?.header;
      if (header?.resultCode && header.resultCode !== "0000") {
        throw new Error(header.resultMsg || "공공데이터 API 오류가 발생했습니다.");
      }

      return data?.response?.body || {};
    }

    function normalizeItems(rawItems) {
      if (!rawItems) return [];
      return Array.isArray(rawItems) ? rawItems : [rawItems];
    }

    async function searchCamping(keyword, reset = true) {
      const clean = keyword.trim();
      if (!clean) {
        showToast("검색어를 입력해 주세요.");
        return;
      }

      if (reset) {
        state.keyword = clean;
        state.pageNo = 1;
        state.items = [];
        state.totalCount = 0;
        $("#resultList").innerHTML = `<div class="loading-box">캠핑장을 검색하고 있습니다.</div>`;
        $("#moreBtn").hidden = true;
        showScreen("resultScreen");
        addRecentKeyword(clean);
      }

      try {
        const body = await fetchGoCamping("searchList", {
          keyword: clean,
          pageNo: state.pageNo,
          numOfRows: state.numOfRows
        });

        const newItems = normalizeItems(body?.items?.item);
        state.totalCount = Number(body?.totalCount || newItems.length || 0);
        state.items = reset ? newItems : [...state.items, ...newItems];
        renderResults();
      } catch (error) {
        renderError(error.message);
      }
    }

    function createCardHTML(item, index, mode) {
      const title = compact(item.facltNm, "캠핑장명 없음");
      const addr = compact(item.addr1 || item.addr2, "주소 정보 없음");
      const image = item.firstImageUrl;
      const type1 = compact(item.induty || item.lctCl, "캠핑장").split(",")[0];
      const type2 = compact(item.doNm || item.sigunguNm, "지역");
      const key = getItemKey(item);
      const saved = isFavorite(item) ? " saved" : "";
      const dataAttr = mode === "favorite" ? `data-favorite-index="${index}"` : `data-index="${index}"`;

      return `
        <button class="result-card" type="button" ${dataAttr}>
          <span class="result-thumb">
            ${image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(title)}">` : `<span class="thumb-empty">NO IMAGE</span>`}
          </span>
          <span class="result-info">
            <strong class="result-title">${escapeHTML(title)}</strong>
            <span class="result-addr">${escapeHTML(addr)}</span>
            <span class="badge-row">
              <span class="badge">${escapeHTML(type1)}</span>
              <span class="badge">${escapeHTML(type2)}</span>
            </span>
          </span>
          <span class="bookmark${saved}" data-key="${escapeHTML(key)}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>
          </span>
          <span class="distance">${escapeHTML(getDistanceText(item))}</span>
        </button>
      `;
    }

    function renderResults() {
      const list = $("#resultList");
      const meta = $("#resultMeta");
      const moreBtn = $("#moreBtn");

      meta.textContent = `“${state.keyword}” 검색 결과 ${state.totalCount.toLocaleString()}건`;

      if (!state.items.length) {
        list.innerHTML = `<div class="empty-box">검색 결과가 없습니다.<br>다른 지역명이나 캠핑장명을 입력해 주세요.</div>`;
        moreBtn.hidden = true;
        return;
      }

      list.innerHTML = state.items.map((item, index) => createCardHTML(item, index, "result")).join("");
      moreBtn.hidden = state.items.length >= state.totalCount;
      updateBookmarkUI();
    }

    function renderFavoriteList() {
      const list = $("#favoriteList");
      const meta = $("#favoriteMeta");
      if (!list || !meta) return;

      meta.textContent = `저장한 캠핑장 ${state.favorites.length.toLocaleString()}건`;

      if (!state.favorites.length) {
        list.innerHTML = `
          <div class="empty-box">
            아직 즐겨찾기한 캠핑장이 없습니다.<br>
            검색 결과나 상세 화면에서 북마크를 눌러 저장해 주세요.<br>
            <button class="empty-action" type="button" data-goto="searchScreen">검색하러 가기</button>
          </div>
        `;
        return;
      }

      list.innerHTML = state.favorites.map((item, index) => createCardHTML(item, index, "favorite")).join("");
      updateBookmarkUI();
    }

    function renderError(message) {
      $("#resultMeta").textContent = "검색 오류";
      $("#moreBtn").hidden = true;
      $("#resultList").innerHTML = `
        <div class="error-box">
          <strong>데이터를 불러오지 못했습니다.</strong><br>
          ${escapeHTML(message)}<br>
          인증키, API 활용 신청 상태, 브라우저 CORS 제한을 확인해 주세요.
        </div>
      `;
    }

    async function openDetail(index, mode = "result") {
      const item = mode === "favorite" ? state.favorites[index] : state.items[index];
      if (!item) return;

      state.selected = item;
      state.previousScreen = mode === "favorite" ? "favoriteScreen" : "resultScreen";

      showScreen("detailScreen");
      renderDetail(item);

      try {
        if (item.contentId) {
          const body = await fetchGoCamping("detailCommon", { contentId: item.contentId });
          const detailItem = normalizeItems(body?.items?.item)[0];
          if (detailItem) {
            state.selected = { ...item, ...detailItem };
            renderDetail(state.selected);
          }
        }
      } catch (error) {
        showToast("기본 정보만 표시합니다.");
      }
    }

    function renderDetail(item) {
      const title = compact(item.facltNm, "캠핑장 상세");
      const addr = compact(item.addr1 || item.addr2, "주소 정보 없음");
      const image = item.firstImageUrl;

      $("#detailHeaderTitle").textContent = title.length > 12 ? title.slice(0, 12) + "…" : title;
      $("#detailTitle").textContent = title;
      $("#detailAddr").textContent = addr;
      $("#detailHero").innerHTML = image ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(title)}">` : `<div class="thumb-empty">NO IMAGE</div>`;

      renderFacilities();
      renderKeywords(item);
      renderInfoList(item);
      renderRelatedImage(item);
      renderKakaoMap(item);
      updateBookmarkUI();
    }

    function renderFacilities() {
      const facilities = [
        ["화장실", "M9 3h6v18H9zM6 21h12M10 7h4"],
        ["샤워실", "M7 4h10M12 4v5M8 13h.01M12 13h.01M16 13h.01M9 17h.01M13 17h.01M17 17h.01"],
        ["편의점/마트", "M5 8h14l-1 13H6L5 8ZM8 8V6a4 4 0 0 1 8 0v2"],
        ["화로대", "M12 3c2 3-2 4 1 7 2 2 1 6-1 8-3-1-5-4-3-7M5 21h14"]
      ];

      $("#facilityGrid").innerHTML = facilities.map(([label, icon]) => `
        <div class="facility-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${icon}"/></svg>
          <span>${label}</span>
        </div>
      `).join("");
    }

    function renderKeywords(item) {
      const raw = [item.posblFcltyCl, item.sbrsCl, item.animalCmgCl, item.themaEnvrnCl, item.lctCl].filter(Boolean).join(",");
      const words = raw.split(/,|\+/).map((word) => word.trim()).filter(Boolean).slice(0, 8);
      const finalWords = words.length ? words : ["차박", "캠핑", "여행"];
      $("#keywordRow").innerHTML = finalWords.map((word) => `<span>#${escapeHTML(word)}</span>`).join("");
    }

    function renderInfoList(item) {
      const rows = [
        ["문의", item.tel],
        ["운영기간", item.operPdCl],
        ["운영일", item.operDeCl],
        ["입지", item.lctCl],
        ["업종", item.induty],
        ["홈페이지", stripHTML(item.homepage || "")],
        ["한줄소개", item.lineIntro],
        ["소개", stripHTML(item.intro || "")]
      ].filter((row) => compact(row[1], "") !== "");

      $("#infoList").innerHTML = rows.length
        ? rows.map(([label, value]) => `<div class="info-row"><dt>${escapeHTML(label)}</dt><dd>${escapeHTML(value)}</dd></div>`).join("")
        : `<div class="info-row"><dt>안내</dt><dd>제공된 상세 정보가 없습니다.</dd></div>`;
    }

    function stripHTML(value) {
      const div = document.createElement("div");
      div.innerHTML = value;
      return div.textContent || div.innerText || "";
    }

    function renderRelatedImage(item) {
      const image = item.firstImageUrl;
      $("#relatedImage").innerHTML = image ? `<img src="${escapeHTML(image)}" alt="관련 이미지">` : `<div class="thumb-empty">관련 이미지가 없습니다.</div>`;
    }

    function renderKakaoMap(item) {
      const lat = Number(item.mapY);
      const lng = Number(item.mapX);
      const mapEl = $("#detailMap");

      if (!lat || !lng) {
        mapEl.innerHTML = `<div class="thumb-empty">지도 좌표 정보가 없습니다.</div>`;
        return;
      }

      if (!window.kakao || !window.kakao.maps) {
        mapEl.innerHTML = `<div class="thumb-empty">카카오 JavaScript 키를 확인해 주세요.</div>`;
        return;
      }

      kakao.maps.load(() => {
        const position = new kakao.maps.LatLng(lat, lng);
        state.map = new kakao.maps.Map(mapEl, { center: position, level: 4 });
        state.marker = new kakao.maps.Marker({ position });
        state.marker.setMap(state.map);
      });
    }

    function openKakaoRoute() {
      const item = state.selected;
      if (!item) return;

      const lat = Number(item.mapY);
      const lng = Number(item.mapX);
      if (!lat || !lng) {
        showToast("길찾기 좌표 정보가 없습니다.");
        return;
      }

      const name = encodeURIComponent(item.facltNm || "캠핑장");
      window.open(`https://map.kakao.com/link/to/${name},${lat},${lng}`, "_blank");
    }

    function getDistanceText(item) {
      const mapX = Number(item.mapX);
      const mapY = Number(item.mapY);
      if (!state.userPosition || !mapX || !mapY) return "-- km";
      const km = getDistanceKm(state.userPosition.lat, state.userPosition.lng, mapY, mapX);
      return `${km.toFixed(km >= 10 ? 1 : 2)}km`;
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function toRad(value) {
      return value * Math.PI / 180;
    }

    function requestUserPosition() {
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (state.items.length) renderResults();
          renderFavoriteList();
        },
        () => {},
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 300000 }
      );
    }

    function bindEvents() {
      $("#searchForm").addEventListener("submit", (event) => {
        event.preventDefault();
        searchCamping($("#searchInput").value, true);
      });

      document.addEventListener("click", (event) => {
        const keywordBtn = event.target.closest(".keyword-btn, .recent-btn");
        if (keywordBtn) {
          const keyword = keywordBtn.textContent.trim();
          $("#searchInput").value = keyword;
          searchCamping(keyword, true);
          return;
        }

        const bookmark = event.target.closest(".bookmark");
        if (bookmark) {
          const resultCard = bookmark.closest(".result-card");
          if (resultCard?.dataset.index !== undefined) {
            event.preventDefault();
            event.stopPropagation();
            toggleFavorite(state.items[Number(resultCard.dataset.index)]);
            return;
          }

          if (resultCard?.dataset.favoriteIndex !== undefined) {
            event.preventDefault();
            event.stopPropagation();
            toggleFavorite(state.favorites[Number(resultCard.dataset.favoriteIndex)]);
            return;
          }
        }

        const resultCard = event.target.closest(".result-card[data-index]");
        if (resultCard) {
          openDetail(Number(resultCard.dataset.index), "result");
          return;
        }

        const favoriteCard = event.target.closest(".result-card[data-favorite-index]");
        if (favoriteCard) {
          openDetail(Number(favoriteCard.dataset.favoriteIndex), "favorite");
          return;
        }

        const gotoBtn = event.target.closest("[data-goto]");
        if (gotoBtn) {
          if (gotoBtn.dataset.goto === "favoriteScreen") renderFavoriteList();
          showScreen(gotoBtn.dataset.goto);
        }
      });

      $("#clearRecentBtn").addEventListener("click", () => {
        setRecentKeywords([]);
        showToast("최근 검색어를 삭제했습니다.");
      });

      $("#moreBtn").addEventListener("click", () => {
        state.pageNo += 1;
        searchCamping(state.keyword, false);
      });

      $("#detailBackBtn").addEventListener("click", () => {
        if (state.previousScreen === "favoriteScreen") renderFavoriteList();
        showScreen(state.previousScreen);
      });

      $("#detailBookmarkBtn").addEventListener("click", () => {
        toggleFavorite(state.selected);
      });

      $("#routeBtn").addEventListener("click", openKakaoRoute);

      $("#mapGuideBtn").addEventListener("click", () => {
        showToast("상세 화면에서 카카오 지도를 확인할 수 있습니다.");
      });
    }

    function initBanner() {
      const img = $("#mainBanner");
      const placeholder = $("#bannerPlaceholder");
      if (img.getAttribute("src")) {
        img.hidden = false;
        placeholder.hidden = true;
      }
    }

    function init() {
      loadFavorites();
      renderRecentKeywords();
      renderFavoriteList();
      bindEvents();
      requestUserPosition();
      initBanner();
    }

    init();
  </script>
</body>
</html>
