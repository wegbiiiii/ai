<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List - Soft Minimal Chic Shop</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <header class="page-header">
            <a href="category.html" class="back-button" aria-label="뒤로가기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </a>
            <h1 class="page-title">Product List</h1>
        </header>

        <div class="main-content">
            <section class="list-hero">
                <div class="list-hero-card">
                    <span class="list-eyebrow">Category Select</span>
                    <h2 class="list-page-title" id="list-page-title">신상품</h2>
                    <p class="list-page-subtitle" id="list-page-subtitle">선택한 카테고리의 아이템을 모아봤어요.</p>
                    <p class="list-meta" id="list-product-count">0 items</p>
                </div>
            </section>

            <section class="product-section">
                <div class="product-grid" id="product-list-grid"></div>
            </section>
        </div>

        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-button" data-tab="home">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="tab-label">Home</span>
            </a>
            <a href="category.html" class="tab-button" data-tab="category">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="7" height="7" x="3" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="14" rx="1"/>
                    <rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
                <span class="tab-label">Category</span>
            </a>
            <a href="cart.html" class="tab-button" data-tab="cart">
                <div class="tab-icon-wrapper">
                    <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <span class="wishlist-badge" id="wishlist-badge" style="display: none;">0</span>
                </div>
                <span class="tab-label">Cart</span>
            </a>
            <a href="my.html" class="tab-button" data-tab="my">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="tab-label">My</span>
            </a>
        </nav>
    </div>

    <script src="./script/script.js"></script>
</body>
</html>
