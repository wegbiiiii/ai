<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #efefef;
      color: #222;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 78px 0 86px;
      position: relative;
    }

    .container {
      width: 1140px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 42px;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #242424;
      margin-bottom: 14px;
    }

    .hero-desc {
      font-size: 17px;
      line-height: 1.6;
      color: #313131;
      font-weight: 500;
    }

    .social-list {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .social-item {
      width: 44px;
      height: 44px;
      display: block;
    }

    .social-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    .community-grid {
      width: 1140px;
      display: grid;
      grid-template-columns: 313px 474px 313px;
      grid-template-rows: 346px 164px;
      grid-template-areas:
        "empty video side"
        "empty contact side";
      gap: 19px;
      align-items: stretch;
    }

    .panel,
    .mini-card {
      border: 1px solid #8e8e8e;
      background: transparent;
      position: relative;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .panel-empty {
      grid-area: empty;
    }

    .panel-video {
      grid-area: video;
      padding: 26px 0 0 30px;
    }

    .panel-contact {
      grid-area: contact;
      padding: 24px 0 0 30px;
    }

    .side-stack {
      grid-area: side;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 19px;
      height: 100%;
    }

    .mini-card {
      padding: 23px 0 0 24px;
      height: 100%;
    }

    .panel-title,
    .card-title {
      font-size: 22px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: #1e1e1e;
      margin-bottom: 18px;
      transition: color 0.3s ease;
    }

    .panel-desc,
    .card-desc {
      font-size: 15px;
      line-height: 1.55;
      font-weight: 700;
      color: #272727;
      transition: color 0.3s ease;
    }

    .panel-video .panel-desc {
      width: 235px;
    }

    .panel-contact .panel-desc {
      width: 228px;
    }

    .mini-card .card-desc {
      width: 190px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 73px;
      height: 22px;
      padding: 0 11px;
      border-radius: 999px;
      background: #ff6b00;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .panel-video .btn {
      margin-top: 27px;
    }

    .panel-contact .btn {
      margin-top: 19px;
    }

    .mini-card .btn {
      margin-top: 24px;
    }

    .panel-empty:hover,
    .mini-card:hover,
    .panel-video:hover,
    .panel-contact:hover {
      background: #ff6b00;
      border-color: #ff6b00;
    }

    .mini-card:hover .card-title,
    .mini-card:hover .card-desc,
    .panel-video:hover .panel-title,
    .panel-video:hover .panel-desc,
    .panel-contact:hover .panel-title,
    .panel-contact:hover .panel-desc {
      color: #fff;
    }

    .mini-card:hover .btn,
    .panel-video:hover .btn,
    .panel-contact:hover .btn {
      background: #fff;
      color: #ff6b00;
    }

    .floating-chat {
      position: fixed;
      right: 42px;
      bottom: 36px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ff6b00;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }

    .floating-chat::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 15px;
      width: 22px;
      height: 17px;
      background: #fff;
      border-radius: 11px;
    }

    .floating-chat::after {
      content: "";
      position: absolute;
      left: 22px;
      top: 28px;
      width: 8px;
      height: 8px;
      background: #fff;
      clip-path: polygon(0 0, 100% 0, 0 100%);
      transform: rotate(-18deg);
    }

    @media (max-width: 1200px) {
      .container {
        width: calc(100% - 48px);
      }

      .community-grid {
        width: 100%;
        grid-template-columns: minmax(240px, 313px) minmax(320px, 474px) minmax(240px, 313px);
      }
    }

    @media (max-width: 1024px) {
      .community-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "empty"
          "video"
          "contact"
          "side";
      }

      .panel-empty {
        min-height: 260px;
      }

      .panel-video,
      .panel-contact,
      .mini-card {
        padding-right: 24px;
        padding-bottom: 24px;
      }

      .panel-video {
        min-height: 300px;
      }

      .panel-contact {
        min-height: 180px;
      }

      .side-stack {
        grid-template-rows: none;
        grid-template-columns: 1fr;
        gap: 19px;
      }

      .mini-card {
        min-height: 150px;
      }

      .panel-video .panel-desc,
      .panel-contact .panel-desc,
      .mini-card .card-desc {
        width: auto;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding-top: 56px;
      }

      .container {
        width: calc(100% - 30px);
      }

      .hero-title {
        font-size: 32px;
      }

      .hero-desc {
        font-size: 15px;
      }

      .social-list {
        gap: 10px;
      }

      .social-item {
        width: 40px;
        height: 40px;
      }

      .floating-chat {
        right: 20px;
        bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <div class="hero">
        <div class="hero-title">COMMUNITY</div>
        <div class="hero-desc">
          삼양식품은 혁신적인 기술과 포용적인 사고로 여러분과 함께<br />
          새로운 식문화를 만들어갑니다.
        </div>
      </div>

      <div class="social-list">
        <a href="#" class="social-item" aria-label="Facebook">
          <img src="./images/ico_facebook.png" alt="페이스북" />
        </a>
        <a href="#" class="social-item" aria-label="Instagram">
          <img src="./images/ico_insta.png" alt="인스타그램" />
        </a>
        <a href="#" class="social-item" aria-label="Blog">
          <img src="./images/ico_blog.png" alt="블로그" />
        </a>
        <a href="#" class="social-item" aria-label="Twitter">
          <img src="./images/ico_twitter.png" alt="트위터" />
        </a>
      </div>

      <div class="community-grid">
        <div class="panel panel-empty"></div>

        <div class="panel panel-video">
          <div class="panel-title">홍보영상</div>
          <div class="panel-desc">
            삼양식품의 다채로운 스토리를<br />
            영상으로 보여드립니다.
          </div>
          <a href="#" class="btn">자세히보기</a>
        </div>

        <div class="side-stack">
          <div class="mini-card">
            <div class="card-title">맛있는 나눔</div>
            <div class="card-desc">모두가 행복한 맛있는 세상</div>
            <a href="#" class="btn">자세히보기</a>
          </div>

          <div class="mini-card">
            <div class="card-title">공지사항</div>
            <div class="card-desc">삼양식품 개인정보취급방침 개정 안내</div>
            <a href="#" class="btn">자세히보기</a>
          </div>

          <div class="mini-card">
            <div class="card-title">삼양식품 공식몰</div>
            <div class="card-desc">
              삼양식품의<br />
              다양한 제품을 만나보세요.
            </div>
            <a href="#" class="btn">자세히보기</a>
          </div>
        </div>

        <div class="panel panel-contact">
          <div class="panel-title">고객 문의</div>
          <div class="panel-desc">
            삼양식품에게<br />
            여러분의 다양한 의견을 남겨주세요.
          </div>
          <a href="#" class="btn">자세히보기</a>
        </div>
      </div>
    </div>

    <div class="floating-chat" aria-hidden="true"></div>
  </div>
</body>
</html>
