<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색엔진 링크 실습</title>
    <style>
        /* 기본 문서 스타일 초기화 및 폰트 설정 */
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 80px 0; /* 화면 상단에서 여백 주기 */
            background-color: #ffffff;
        }

        /* 전체 컨텐츠를 감싸고 가운데 정렬하는 컨테이너 */
        .container {
            text-align: center;
        }

        /* 제목 스타일 */
        h1 {
            font-size: 28px;
            color: #000000;
            margin: 0 0 15px 0;
            font-weight: bold;
        }

        /* 제목 아래 보라색 가로선 스타일 */
        .separator {
            border: none;
            border-top: 2px solid #9b6a9c; /* 시안과 유사한 보라색 지정 */
            width: 200px; /* 선의 너비를 200px로 수정 */
            margin: 0 auto 25px auto; /* 가운데 정렬 및 아래 여백 */
        }

        /* p 태그 기본 여백 초기화 및 간격 설정 */
        p {
            margin: 0 0 15px 0; /* 각 링크 사이의 세로 여백 */
        }

        /* 하이퍼링크 스타일 설정 */
        a {
            text-decoration: none; /* 밑줄 제거 */
            color: #333333; /* 기본 텍스트 색상 (진한 회색) */
            font-size: 16px;
        }

        /* 마우스를 올렸을 때(호버) 효과 설정 (선택 사항) */
        a:hover {
            color: #000000;
            text-decoration: underline; /* 마우스 오버 시 밑줄 표시 */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>검색엔진</h1>
        
        <!-- 보라색 구분선 -->
        <hr class="separator">
        
        <!-- 하이퍼링크 목록 (p 태그 사용) -->
        <p><a href="https://www.naver.com" target="_blank">네이버</a></p>
        <p><a href="https://www.daum.net" target="_blank">다음</a></p>
        <p><a href="https://www.google.com" target="_blank">구글</a></p>
        <p><a href="https://www.nate.com" target="_blank">네이트</a></p>
        <!-- 인터넷 우체국 배송조회 링크 적용 -->
        <p><a href="https://service.epost.go.kr/iservice/usr/trace/usrtrc001k01.jsp" target="_blank">배송조회</a></p>
        <p><a href="#">쇼핑몰 사이트로 가기</a></p>
    </div>

</body>
</html>
