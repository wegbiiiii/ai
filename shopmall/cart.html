<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Soft Minimal Chic Shop</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="page-header">
            <h1 class="page-title">Cart</h1>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Cart Items -->
            <section class="cart-section">
                <div class="cart-items" id="cart-items">
                    <!-- Cart items will be rendered here -->
                    <div class="cart-item">
                        <div class="cart-item-image">
                            <img src="https://images.unsplash.com/photo-1755519024774-864df34fcf94?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxiZWlnZSUyMHN3ZWF0ZXIlMjB3b21hbnxlbnwxfHx8fDE3NzQ5MjQxNTd8MA&ixlib=rb-4.1.0&q=80&w=400" 
                                 alt="소프트 베이지 니트">
                        </div>
                        <div class="cart-item-info">
                            <h3 class="cart-item-name">소프트 베이지 니트</h3>
                            <p class="cart-item-option">사이즈: Free / 컬러: Beige</p>
                            <div class="cart-item-bottom">
                                <div class="quantity-control">
                                    <button class="quantity-btn minus">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M5 12h14"/>
                                        </svg>
                                    </button>
                                    <span class="quantity-value">1</span>
                                    <button class="quantity-btn plus">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M12 5v14m-7-7h14"/>
                                        </svg>
                                    </button>
                                </div>
                                <p class="cart-item-price">57,800원</p>
                            </div>
                        </div>
                        <button class="cart-item-remove">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6 6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>

                    <div class="cart-item">
                        <div class="cart-item-image">
                            <img src="https://images.unsplash.com/photo-1764271692129-767f58952c26?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w3Nzg4Nzd8MHwxfHNlYXJjaHwxfHxzb2Z0JTIwcGluayUyMGJsb3VzZXxlbnwxfHx8fDE3NzQ5MjQxNTh8MA&ixlib=rb-4.1.0&q=80&w=400" 
                                 alt="로즈 실크 블라우스">
                        </div>
                        <div class="cart-item-info">
                            <h3 class="cart-item-name">로즈 실크 블라우스</h3>
                            <p class="cart-item-option">사이즈: M / 컬러: Rose</p>
                            <div class="cart-item-bottom">
                                <div class="quantity-control">
                                    <button class="quantity-btn minus">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M5 12h14"/>
                                        </svg>
                                    </button>
                                    <span class="quantity-value">2</span>
                                    <button class="quantity-btn plus">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M12 5v14m-7-7h14"/>
                                        </svg>
                                    </button>
                                </div>
                                <p class="cart-item-price">142,400원</p>
                            </div>
                        </div>
                        <button class="cart-item-remove">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6 6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Coupon Section -->
            <section class="coupon-section">
                <div class="coupon-input-wrapper">
                    <input type="text" class="coupon-input" placeholder="쿠폰 코드를 입력하세요">
                    <button class="coupon-apply-btn">적용</button>
                </div>
            </section>

            <!-- Price Summary -->
            <section class="price-summary">
                <div class="price-row">
                    <span class="price-label">상품 금액</span>
                    <span class="price-value">200,200원</span>
                </div>
                <div class="price-row">
                    <span class="price-label">할인 금액</span>
                    <span class="price-value discount">-0원</span>
                </div>
                <div class="price-row">
                    <span class="price-label">배송비</span>
                    <span class="price-value">무료</span>
                </div>
                <div class="price-divider"></div>
                <div class="price-row total">
                    <span class="price-label">최종 결제 금액</span>
                    <span class="price-value">200,200원</span>
                </div>
            </section>

            <!-- Empty space for button -->
            <div style="height: 100px;"></div>
        </div>

        <!-- Fixed Bottom Button -->
        <div class="fixed-bottom-button">
            <button class="checkout-button">
                <span>200,200원 결제하기</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </button>
        </div>

        <!-- Bottom Tab Bar -->
        <nav class="bottom-tab-bar">
            <a href="index.html" class="tab-button" data-tab="home">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span class="tab-label">Home</span>
            </a>
            <a href="category.html" class="tab-button" data-tab="category">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect width="7" height="7" x="3" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="14" rx="1"/>
                    <rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
                <span class="tab-label">Category</span>
            </a>
            <a href="cart.html" class="tab-button active" data-tab="cart">
                <div class="tab-icon-wrapper">
                    <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg>
                    <span class="wishlist-badge" id="wishlist-badge" style="display: flex;">2</span>
                </div>
                <span class="tab-label">Cart</span>
            </a>
            <a href="my.html" class="tab-button" data-tab="my">
                <svg class="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="tab-label">My</span>
            </a>
        </nav>
    </div>

    <script src="./script/cart.js"></script>
</body>
</html>
