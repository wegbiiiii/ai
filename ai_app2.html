<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그렇게 사랑합니다 - 한용운</title>
  <style>
    body {
      background-color: #90ee90;
    }
 
    .poem-author {
      text-align: right;
    }
 
    .stanza-center {
      text-align: center;
    }
 
    .stanza-right {
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>그렇게 사랑합니다.</h1>
 
  <p class="poem-author">-한용운-</p>
 
  <div class="stanza-left">
    <p>사랑한다는 사랑앞에서는</p>
    <p>사랑 한다는말을 안합니다.</p>
    <p>안하는것이아니라</p>
    <p>못하는것이 사랑의 진실입니다.</p>
  </div>
 
  <div class="stanza-center">
    <p>잊어버려야 하겠다는 말은</p>
    <p>잊을수 없다는말입니다.</p>
    <p>정말 잊고싶을 때는 말이 없습니다.</p>
  </div>
 
  <div class="stanza-right">
    <p>헤어질때 돌아보지 않는것은</p>
    <p>너무 헤어지기 싫기때문입니다.</p>
    <p>그것은 헤어지는것이 아니라</p>
    <p>같이 있다는 말입니다.</p>
  </div>
 
</body>
</html>
