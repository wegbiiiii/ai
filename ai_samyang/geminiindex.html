<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼양식품 커뮤니티 시안</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 60px 0;
        }

        .container {
            width: 100%;
            text-align: center;
        }

        /* 헤더 섹션 */
        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #333;
        }

        header p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 25px;
            word-break: keep-all;
            font-weight: 500;
        }

        /* 소셜 미디어 아이콘 */
        .sns-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        .sns-link {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            display: block;
            transition: transform 0.2s;
        }

        .sns-link:hover {
            transform: scale(1.1);
        }

        .sns-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 그리드 레이아웃 섹션 - gap 19px 적용 */
        .grid-container {
            display: grid;
            grid-template-columns: 313px 474px 313px; 
            grid-template-rows: 170px 170px 170px;
            gap: 19px;
            width: 1140px;
            margin: 0 auto;
            text-align: left;
            grid-template-areas: 
                "left-space main-video right-top"
                "left-space main-video right-middle"
                "left-space sub-left sub-right";
        }

        /* 개별 카드 스타일 */
        .card, .card-empty {
            border: 1px solid #333;
            padding: 30px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            background-color: #fff;
            position: relative;
        }

        /* 호버 효과: 오렌지 배경으로 변경 (왼쪽 빈 카드 포함) */
        .card:hover, .card-empty:hover {
            background-color: #ff6600;
            border-color: #ff6600;
            color: #fff;
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .card p {
            font-size: 0.9rem;
            color: #333;
            transition: color 0.3s ease;
            line-height: 1.5;
            word-break: keep-all;
        }

        .card:hover p {
            color: #fff;
        }

        /* 버튼 스타일 - 왼쪽 배치 */
        .btn-more {
            display: inline-block;
            background-color: #ff6600;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: auto; 
            margin-right: auto; 
            transition: all 0.3s ease;
        }

        /* 호버 시 버튼 색상 반전 */
        .card:hover .btn-more {
            background-color: #fff;
            color: #ff6600;
        }

        /* 중앙 영상 카드는 버튼 위쪽 여백 추가 */
        .card-video .btn-more {
            margin-top: 50px; 
        }

        /* 영역별 위치 지정 */
        .card-empty { 
            grid-area: left-space; 
            /* pointer-events: none; 제거하여 호버 가능하게 수정 */
        }
        .card-video { grid-area: main-video; }
        .card-share { grid-area: right-top; }
        .card-notice { grid-area: right-middle; }
        .card-contact { grid-area: sub-left; }
        .card-mall { grid-area: sub-right; }

        /* 하단 우측 플로팅 아이콘 */
        .chat-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #ff6600;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 100;
        }

        .chat-icon img {
            width: 32px;
            height: 32px;
        }

        /* 반응형 디자인 */
        @media (max-width: 1180px) {
            .grid-container {
                width: 95%;
                grid-template-columns: 1fr 1.5fr 1fr;
            }
        }

        @media (max-width: 850px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
                grid-template-areas: 
                    "main-video main-video"
                    "right-top right-middle"
                    "sub-left sub-right";
                grid-template-rows: auto;
            }
            .card-empty { display: none; }
            .card { min-height: 180px; }
        }

        @media (max-width: 550px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "main-video"
                    "right-top"
                    "right-middle"
                    "sub-left"
                    "sub-right";
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>COMMUNITY</h1>
            <p>삼양식품은 혁신적인 기술과 포용적인 사고로 여러분과 함께<br>새로운 식문화를 만들어갑니다.</p>
            
            <div class="sns-icons">
                <a href="#" class="sns-link">
                    <img src="./images/ico_facebook.png" alt="Facebook">
                </a>
                <a href="#" class="sns-link">
                    <img src="./images/ico_insta.png" alt="Instagram">
                </a>
                <a href="#" class="sns-link">
                    <img src="./images/ico_blog.png" alt="Blog">
                </a>
                <a href="#" class="sns-link">
                    <img src="./images/ico_twitter.png" alt="Twitter">
                </a>
            </div>
        </header>

        <main class="grid-container">
            <!-- 왼쪽 빈 영역 (호버 기능 추가됨) -->
            <div class="card-empty"></div>

            <!-- 홍보영상 -->
            <a href="#" class="card card-video">
                <div class="content">
                    <h2>홍보영상</h2>
                    <p>삼양식품의 다채로운 스토리를<br>영상으로 보여드립니다.</p>
                </div>
                <div class="btn-more">자세히 보기</div>
            </a>

            <!-- 맛있는 나눔 -->
            <a href="#" class="card card-share">
                <div class="content">
                    <h2>맛있는 나눔</h2>
                    <p>모두가 행복한 맛있는 세상</p>
                </div>
                <div class="btn-more">자세히 보기</div>
            </a>

            <!-- 공지사항 -->
            <a href="#" class="card card-notice">
                <div class="content">
                    <h2>공지사항</h2>
                    <p>삼양식품 개인정보취급방침 개정 안내</p>
                </div>
                <div class="btn-more">자세히 보기</div>
            </a>

            <!-- 고객 문의 -->
            <a href="#" class="card card-contact">
                <div class="content">
                    <h2>고객 문의</h2>
                    <p>삼양식품에게<br>여러분의 다양한 의견을 남겨주세요.</p>
                </div>
                <div class="btn-more">자세히 보기</div>
            </a>

            <!-- 삼양식품 공식몰 -->
            <a href="#" class="card card-mall">
                <div class="content">
                    <h2>삼양식품 공식몰</h2>
                    <p>삼양식품의<br>다양한 제품을 만나보세요.</p>
                </div>
                <div class="btn-more">자세히 보기</div>
            </a>
        </main>
    </div>

    <div class="chat-icon">
        <img src="" alt="Chat">
    </div>

</body>
</html>
