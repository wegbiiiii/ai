<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 랜딩 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #4B3F72;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 100px; 
            padding-bottom: 80px;
        }

        /* 타이틀 섹션 스타일링 */
        .main-title {
            font-size: 48px;
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: -1.5px;
            margin-bottom: 40px; 
        }
        .main-title .highlight {
            font-weight: 700;
            color: white;
        }

        /* 타이머 섹션 스타일링 - 구조 변경 */
        .timer-content-wrapper {
            width: 652px; /* 가로 크기 652px 고정 */
            height: 152px; /* 세로 크기 152px 고정 */
            display: flex;
            align-items: center;
            justify-content: space-between;

            border-radius: 8px;
            padding: 0; /* 패딩 제거 */
            margin: 0 auto;
        }

        .timer-box-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* 숫자 박스 사이 간격 조정 */

        }

        .timer-box {
            background: linear-gradient(180deg, #6B5B95 50%, #A450A4 50%);
            border-radius: 4px;
            width: 90px;
            height: 125px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 56px;
            font-weight: 700;
            box-shadow: none;
        }

        .timer-divider {
            font-size: 48px;
            font-weight: 700;
            color: #111111;
        }

        /* 서브 텍스트 및 검색창 안내 */
        .sub-info-container {
            margin-top: 45px; 
            margin-bottom: 70px; 
        }
        .sub-text {
            font-size: 16px;
            font-weight: 400;
            color: #E2E8F0;
            margin-right: 14px;
            letter-spacing: -0.5px;
        }
        .search-hint-box {
            background-color: white;
            color: #606060;
            width: 387px;
            height: 40px;
            border: 2px solid #00C73C;
            border-radius: 4px;
            padding: 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .search-hint-box span{
            color: #00c73c;
        }

        /* 메인 이벤트 박스 (940px) */
        .content-container {
            width: 940px;
            background-color: #3B3060;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 70px 0 80px 0;
        }

        /* 질문 섹션 */
        .question-title {
            font-size: 22px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        .question-hint {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* 카드 그리드 설정 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 232px);
            gap: 23px 22px; 
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            color: black;
            border-radius: 4px;
            width: 232px;
            height: 342px;
            padding: 24px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .sold-out-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .product-img {
            max-width: 100%;
            max-height: 140px;
            object-fit: contain;
        }

        /* 정답 입력 및 버튼 */
        .answer-input {
            width: 740px;
            height: 60px;
            background-color: white;
            border-radius: 4px;
            color: black;
            padding: 0 20px;
            font-size: 18px;
            outline: none;
            margin-bottom: 40px;
            box-shadow: none;
            border: none;
        }

        .submit-button {
            background-color: #6310FF;
            color: white;
            width: 520px; 
            height: 70px; 
            font-size: 20px; 
            font-weight: 700;
            border-radius: 4px;
            transition: background 0.2s;
            box-shadow: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .submit-button:hover { background-color: #5209D6; }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<!-- 상단 헤더 섹션 -->
<div class="text-center w-full flex flex-col items-center">
    <h1 class="main-title">
        매일 밤 <span class="highlight">10시</span> 이벤트가 시작됩니다!
    </h1>

    <!-- 타이머 섹션 (652px x 152px) -->
    <div id="timer" class="timer-content-wrapper">
        <!-- 시 -->
        <div class="timer-box-group">
            <div class="timer-box" id="h1">0</div>
            <div class="timer-box" id="h2">0</div>
        </div>
        
        <span class="timer-divider">:</span>
        
        <!-- 분 -->
        <div class="timer-box-group">
            <div class="timer-box" id="m1">0</div>
            <div class="timer-box" id="m2">0</div>
        </div>
        
        <span class="timer-divider">:</span>
        
        <!-- 초 -->
        <div class="timer-box-group">
            <div class="timer-box" id="s1">0</div>
            <div class="timer-box" id="s2">0</div>
        </div>
    </div>

    <div class="sub-info-container flex justify-center items-center">
        <span class="sub-text">회원님이 보다 빠르게 정답을 찾을 수 있도록</span>
        <div class="search-hint-box">
            <span>초록 검색창을 띄워두세요!</span>
            <span style="font-size: 10px;">▼</span>
        </div>
    </div>
</div>

<!-- 메인 이벤트 박스 -->
<div class="content-container">
    <div class="text-center">
        <h2 class="question-title">
            Q. 3월 13일 문제 : 커넥츠에서 등업을 하려면 어떤 신청을 해야 할까요?
        </h2>
        <p class="question-hint">
            (힌트 : OOO신청 / 3글자)
        </p>
    </div>

    <!-- 상품 그리드 -->
    <div class="product-grid">
        <div class="product-card">
            <h3 class="text-[14px] font-normal text-gray-800">카메라</h3>
            <div class="flex-grow flex items-center justify-center">
                <img src="./images/카메라.jpg" alt="camera" class="product-img">
            </div>
            <div class="w-full">
                <p class="text-[#8B5CF6] text-sm font-bold mb-4">3개 남음</p>
                <div class="flex justify-center border-t pt-4">
                    <input type="radio" name="product" value="0" class="w-5 h-5 accent-[#8B5CF6] cursor-pointer">
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="sold-out-overlay">SOLD OUT</div>
            <h3 class="text-[14px] font-normal text-gray-800">웹캠</h3>
            <div class="flex-grow flex items-center justify-center">
                <img src="./images/웹캠.jpg" alt="webcam" class="product-img">
            </div>
            <div class="w-full">
                <p class="text-gray-400 text-sm font-bold mb-4">마감되었습니다</p>
                <div class="flex justify-center border-t pt-4">
                    <input type="radio" name="product" value="1" disabled class="w-5 h-5 accent-gray-400 cursor-not-allowed">
                </div>
            </div>
        </div>

        <div class="product-card">
            <h3 class="text-[14px] font-normal text-gray-800">마우스</h3>
            <div class="flex-grow flex items-center justify-center">
                <img src="./images/마우스.jpg" alt="mouse" class="product-img">
            </div>
            <div class="w-full">
                <p class="text-[#8B5CF6] text-sm font-bold mb-4">3개 남음</p>
                <div class="flex justify-center border-t pt-4">
                    <input type="radio" name="product" value="2" class="w-5 h-5 accent-[#8B5CF6] cursor-pointer">
                </div>
            </div>
        </div>

        <div class="product-card">
            <h3 class="text-[14px] font-normal text-gray-800">램</h3>
            <div class="flex-grow flex items-center justify-center">
                <img src="./images/램.jpg" alt="ram" class="product-img">
            </div>
            <div class="w-full">
                <p class="text-[#8B5CF6] text-sm font-bold mb-4">5개 남음</p>
                <div class="flex justify-center border-t pt-4">
                    <input type="radio" name="product" value="3" class="w-5 h-5 accent-[#8B5CF6] cursor-pointer">
                </div>
            </div>
        </div>

        <div class="product-card">
            <h3 class="text-[14px] font-normal text-gray-800">외장하드</h3>
            <div class="flex-grow flex items-center justify-center">
                <img src="./images/외장하드.jpg" alt="HDD" class="product-img">
            </div>
            <div class="w-full">
                <p class="text-[#8B5CF6] text-sm font-bold mb-4">1개 남음</p>
                <div class="flex justify-center border-t pt-4">
                    <input type="radio" name="product" value="4" class="w-5 h-5 accent-[#8B5CF6] cursor-pointer">
                </div>
            </div>
        </div>

        <div class="product-card">
            <h3 class="text-[14px] font-normal text-gray-800">키보드</h3>
            <div class="flex-grow flex items-center justify-center">
                <img src="./images/키보드.jpg" alt="keyboard" class="product-img">
            </div>
            <div class="w-full">
                <p class="text-[#8B5CF6] text-sm font-bold mb-4">12개 남음</p>
                <div class="flex justify-center border-t pt-4">
                    <input type="radio" name="product" value="5" class="w-5 h-5 accent-[#8B5CF6] cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- 정답 입력 -->
    <input type="text" class="answer-input" placeholder="">

    <!-- 응모 버튼 -->
    <button id="openModal" class="submit-button">
        응모하기
    </button>
</div>

<!-- 모달 폼 -->
<div id="entryModal" class="modal">
    <div class="bg-white text-gray-800 p-8 rounded-lg w-full max-w-md shadow-2xl relative">
        <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-3xl font-light">&times;</button>
        <h2 class="text-2xl font-bold mb-8 text-center text-[#6310FF]">이벤트 응모</h2>
        <form id="eventForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">이름</label>
                <input type="text" name="Name" required class="w-full px-4 py-3 border border-gray-300 rounded focus:border-[#6310FF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">이메일</label>
                <input type="email" name="Email" required class="w-full px-4 py-3 border border-gray-300 rounded focus:border-[#6310FF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2 text-gray-700">메시지</label>
                <textarea name="Message" required rows="4" class="w-full px-4 py-3 border border-gray-300 rounded focus:border-[#6310FF] outline-none resize-none"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-[#6310FF] hover:bg-[#5209D6] text-white font-bold py-4 rounded transition-colors text-lg mt-4">
                신청하기
            </button>
        </form>
        <div id="statusMsg" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>
</div>

<script>
    function updateTimer() {
        const now = new Date();
        const target = new Date();
        target.setHours(22, 0, 0, 0);
        if (now > target) target.setDate(target.getDate() + 1);
        const diff = target - now;
        const h = Math.floor(diff / 1000 / 60 / 60);
        const m = Math.floor((diff / 1000 / 60) % 60);
        const s = Math.floor((diff / 1000) % 60);
        const hStr = h.toString().padStart(2, '0');
        const mStr = m.toString().padStart(2, '0');
        const sStr = s.toString().padStart(2, '0');
        document.getElementById('h1').innerText = hStr[0];
        document.getElementById('h2').innerText = hStr[1];
        document.getElementById('m1').innerText = mStr[0];
        document.getElementById('m2').innerText = mStr[1];
        document.getElementById('s1').innerText = sStr[0];
        document.getElementById('s2').innerText = sStr[1];
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    const modal = document.getElementById('entryModal');
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');
    openBtn.onclick = () => { modal.style.display = 'flex'; document.body.style.overflow = 'hidden'; };
    closeBtn.onclick = () => { modal.style.display = 'none'; document.body.style.overflow = 'auto'; };

    const form = document.getElementById('eventForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPQs-hM9kvi2g9hVoovp-5VGxMnw-9njoYWIH9xqUFxIWwZUuDIdKP_YpLzzk8n5nnkg/exec';

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusMsg.classList.remove('hidden');
        statusMsg.innerText = '전송 중...';
        const formData = new FormData(form);
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: formData })
        .then(() => {
            statusMsg.innerText = '신청 완료!';
            setTimeout(() => { closeBtn.onclick(); submitBtn.disabled = false; }, 1500);
        });
    });
</script>

</body>
</html>
