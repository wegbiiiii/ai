<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>
        [폼구성 요소 알아보기]
    </h1>

    <!--method는 데이터를 전송하는 방식. 값은 get(보안이 좋지 않음), post 방식-->

    <form action="login.jsp" name="로그인" method="post">
        <fieldset>
            <legend>로그인 화면</legend>
            <ol>
                <li class="idbox">
                    <label for="idinput">ID</label>
                    <input type="text" name="id" placeholder="아이디 또는 전화번호" id="idinput">
                </li>
                <li>
                    <label for="pwinput">PASSWORD</label>
                    <input type="password" name="password" placeholder="비밀번호를 입력해주세요" id="pwinput">
                </li>
            </ol>
        </fieldset>
        <!--서버로 데이터를 전송-->
        <input type="submit" value="로그인" />
        <!--입력한 데이터를 초기화 하는 버튼-->
        <input type="reset" value="다시입력"/>
        

    </form>

    <form action="login2.jsp" name="my" method="post">
        <fieldset>
            <legend>개인신상정보</legend>
            <ul >
                <li>
                    <input type="radio" name="gender" id="men" /><label for="">남자</label>
                    <input type="radio" name="gender" id="women" checked/><label for="">여자</label> 
                </li>

                <li>
                    <label for="tour">여행</label>
                    <input type="checkbox" name="chk" value="여행" id="tour"/>
                    <label for="movie">영화</label>
                    <input type="checkbox" name="chk2" value="영화" id="movie" />
                    <label for="book">독서</label>
                    <input type="checkbox" name="chk3" value="독서" id="book"/>
                </li>

                <li>
                    <label for="color">컬러선택</label>
                    <select name="colorlist" id="color">
                        <option value="">::::: 색상선택 :::::</option>
                        <option value="빨강">빨간색</option>
                        <option value="초록">녹색</option>
                        <option value="파랑">파란색</option>
                    </select>
                </li>

                <li>
                    <label for="ms">MESSAGE</label>
                    <!--여러줄을 입력 받을때-->
                    <textarea name="msg" id="ms" cols="60" rows="20">문의사항 작성</textarea>
                </li>

                <li>
                    <label for="file">파일첨부</label>
                    <input type="file" id="file" name="file">
                </li>

                <li>
                    <label for="color">색상선택</label>
                    <input type="color" name="color" id="col">
                </li>

                <li>
                    <label for="ddd">예약날짜</label>
                    <input type="date" name="date" id="ddd">
                </li>

                <li>
                    <label for="time">예약시간</label>
                    <input type="time" name="time" id="time">
                </li>

                <li>
                    <label for="dt">날짜/시간예약</label>
                    <input type="datetime-local" name="datetime" id="dt">
                </li>

                <li>
                    <label for="ml">리스트 목록(다중선택)</label>
                    <select name="multiselect" id="ml" multiple>
                        <option value="">사이즈를 선택하세요</option>
                        <option value="44">44</option>
                        <option value="55">55</option>
                        <option value="66">66</option>
                        <option value="77">77</option>
                    </select>
                </li>
            </ul>

        </fieldset>
        <!--서버로 데이터를 전송-->
        <input type="submit" value="가입" />
        <!--입력한 데이터를 초기화 하는 버튼-->
        <input type="reset" value="다시입력"/>

    </form>
</body>
</html>
